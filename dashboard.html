<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Noto Sans KR','Noto Sans Thai',sans-serif;background:#f3f0ff;min-height:100vh;}
/* 헤더 바 — page-header.js 사용. box-shadow만 db-header용으로 추가 오버라이드 */
.db-header{box-shadow:0 2px 8px rgba(124,58,237,.3);}
.db-header-btns{display:flex;gap:6px;}
.db-header-btns button{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.db-header-btns button:hover{background:rgba(255,255,255,.35);}
.db-container{max-width:1200px;margin:0 auto;padding:16px;}
.db-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
.db-filters select,.db-filters input[type="date"]{padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff;outline:none;}
.db-filters select:focus,.db-filters input[type="date"]:focus{border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,.15);}
.db-filters .custom-range{display:none;gap:6px;align-items:center;}
.db-filters .custom-range.show{display:flex;}
.db-filters .custom-range span{color:#6b7280;font-size:13px;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.kpi-card:nth-child(1)::before{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.kpi-card:nth-child(2)::before{background:linear-gradient(90deg,#059669,#34d399);}
.kpi-card:nth-child(3)::before{background:linear-gradient(90deg,#2563eb,#60a5fa);}
.kpi-card:nth-child(4)::before{background:linear-gradient(90deg,#d97706,#fbbf24);}
.kpi-label{font-size:13px;color:#6b7280;margin-bottom:6px;}
.kpi-value{font-size:28px;font-weight:700;color:#1f2937;}
.kpi-sub{font-size:12px;color:#9ca3af;margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi-sub .up{color:#059669;}
.kpi-sub .down{color:#ef4444;}
.kpi-sub .neutral{color:#9ca3af;}
.kpi-breakdown{font-size:11px;color:#9ca3af;margin-top:4px;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.chart-box{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.chart-box h3{font-size:14px;font-weight:600;color:#374151;margin-bottom:12px;}
.chart-box canvas{width:100%!important;max-height:280px;}
.full-width{grid-column:1/-1;}
.ranking-section,.recent-section{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px;}
.ranking-section h3,.recent-section h3{font-size:15px;font-weight:600;color:#374151;margin-bottom:14px;}
.db-table{width:100%;border-collapse:collapse;font-size:13px;}
.db-table th{background:#f9fafb;padding:10px 12px;text-align:left;font-weight:600;color:#6b7280;border-bottom:2px solid #e5e7eb;}
.db-table td{padding:10px 12px;border-bottom:1px solid #f3f4f6;color:#374151;}
.db-table tr:hover{background:#f5f3ff;}
.db-table tr.my-row{background:#ede9fe;}
.db-table tr.my-row:hover{background:#ddd6fe;}
.rank-num{font-weight:700;color:#7c3aed;}
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.status-pending{background:#fef3c7;color:#92400e;}
.status-shipping{background:#dbeafe;color:#1e40af;}
.status-done{background:#d1fae5;color:#065f46;}
.status-cancelled{background:#fee2e2;color:#991b1b;}
.db-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:#7c3aed;}
.db-spinner{width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:#7c3aed;border-radius:50%;animation:dbspin .7s linear infinite;margin-bottom:12px;}
@keyframes dbspin{to{transform:rotate(360deg);}}
.db-no-data{text-align:center;color:#9ca3af;padding:30px;font-size:14px;}
.db-minimized{display:none;position:fixed;bottom:16px;left:16px;z-index:9999;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:10px 20px;border-radius:30px;cursor:pointer;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(124,58,237,.4);display:flex;align-items:center;gap:8px;}
.db-minimized.show{display:flex;}
.db-main-wrap{display:block;}
.db-main-wrap.hidden{display:none;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);}.charts-row{grid-template-columns:1fr;}}
@media(max-width:500px){.kpi-row{grid-template-columns:1fr;}.db-table{font-size:12px;}.db-table th,.db-table td{padding:8px 6px;}.db-filters{flex-direction:column;align-items:stretch;}}
</style>

<script src="firebase-init.js?v=1"></script>
<script>
// Firebase init (shared via firebase-init.js)
var db = firebase.firestore();

function getCurrentUser() {
  var u = JSON.parse(sessionStorage.getItem('current_user') || 'null');
  if (u) return u;
  if (localStorage.getItem('auto_login') === 'true') {
    return JSON.parse(localStorage.getItem('current_user_persist') || 'null');
  }
  return null;
}

function _isAdmin(u) {
  if (!u) return false;
  var HARDCODED_ADMINS = ['T2408087'];
  return HARDCODED_ADMINS.includes(u.empid) || u.role === 'admin';
}

/* ── i18n ── */
var DB_LANG = {
  db_title:          ['영업 실적 대시보드','Sales Dashboard','แดชบอร์ดยอดขาย'],
  db_this_month:     ['이번 달','This Month','เดือนนี้'],
  db_last_month:     ['지난 달','Last Month','เดือนที่แล้ว'],
  db_this_quarter:   ['이번 분기','This Quarter','ไตรมาสนี้'],
  db_custom:         ['기간 설정','Custom Range','กำหนดเอง'],
  db_total_orders:   ['총 주문','Total Orders','คำสั่งซื้อทั้งหมด'],
  db_revenue:        ['매출액','Revenue','รายได้'],
  db_visits:         ['방문 수','Visits','จำนวนเยี่ยม'],
  db_avg_order:      ['평균 주문액','Avg Order','เฉลี่ยต่อออเดอร์'],
  db_daily_orders:   ['일별 주문 추이','Daily Orders','คำสั่งซื้อรายวัน'],
  db_status_dist:    ['주문 상태 분포','Order Status','สถานะคำสั่งซื้อ'],
  db_top_customers:  ['고객별 주문','Top Customers','ลูกค้าอันดับสูง'],
  db_ranking:        ['영업 실적 순위','Sales Ranking','อันดับยอดขาย'],
  db_rank:           ['순위','Rank','อันดับ'],
  db_name:           ['이름','Name','ชื่อ'],
  db_recent:         ['최근 주문','Recent Orders','คำสั่งซื้อล่าสุด'],
  db_pending:        ['대기','Pending','รอดำเนินการ'],
  db_shipping:       ['발송','Shipping','จัดส่ง'],
  db_done:           ['완료','Done','เสร็จ'],
  db_cancelled:      ['취소','Cancelled','ยกเลิก'],
  db_vs_prev:        ['전기 대비','vs Previous','เทียบกับก่อนหน้า'],
  db_no_data:        ['데이터가 없습니다','No data available','ไม่มีข้อมูล'],
  db_all_employees:  ['전체 직원','All Employees','พนักงานทั้งหมด'],
  db_items:          ['건','orders','รายการ'],
  db_currency:       ['฿','฿','฿']
};

var _langIdx = {ko:0,en:1,th:2};
var _curLang = localStorage.getItem('lang') || 'ko';

function _t(key) {
  var arr = DB_LANG[key];
  if (!arr) return key;
  var idx = _langIdx[_curLang] !== undefined ? _langIdx[_curLang] : 0;
  return arr[idx] || arr[0];
}

/* ── Window controls ── */
var _isMinimized = false;
function dbMinimize() {
  _isMinimized = true;
  document.getElementById('dbMainWrap').classList.add('hidden');
  document.getElementById('dbMinimized').classList.add('show');
}
function dbRestore() {
  _isMinimized = false;
  document.getElementById('dbMainWrap').classList.remove('hidden');
  document.getElementById('dbMinimized').classList.remove('show');
}
function dbFullscreen() {
  var el = document.documentElement;
  if (!document.fullscreenElement) { el.requestFullscreen && el.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
function dbClose() {
  if (window.opener) { window.close(); }
  else { history.back(); }
}

/* ── Date helpers ── */
function getDateRange(period) {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if (period === 'this_month') {
    return { from: new Date(y, m, 1), to: new Date(y, m + 1, 0, 23, 59, 59) };
  } else if (period === 'last_month') {
    return { from: new Date(y, m - 1, 1), to: new Date(y, m, 0, 23, 59, 59) };
  } else if (period === 'this_quarter') {
    var qm = Math.floor(m / 3) * 3;
    return { from: new Date(y, qm, 1), to: new Date(y, qm + 3, 0, 23, 59, 59) };
  }
  return null;
}

function getPrevRange(period) {
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  if (period === 'this_month') {
    return { from: new Date(y, m - 1, 1), to: new Date(y, m, 0, 23, 59, 59) };
  } else if (period === 'last_month') {
    return { from: new Date(y, m - 2, 1), to: new Date(y, m - 1, 0, 23, 59, 59) };
  } else if (period === 'this_quarter') {
    var qm = Math.floor(m / 3) * 3;
    return { from: new Date(y, qm - 3, 1), to: new Date(y, qm, 0, 23, 59, 59) };
  }
  return null;
}

function fmtDate(d) {
  var mm = ('0' + (d.getMonth() + 1)).slice(-2);
  var dd = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + mm + '-' + dd;
}

function fmtNum(n) {
  if (n === undefined || n === null) return '0';
  return Number(n).toLocaleString('en-US');
}

/* ── Revenue calc ── */
function calcRevenue(order) {
  var total = 0;
  if (order.items && Array.isArray(order.items)) {
    order.items.forEach(function(it) {
      var p = parseFloat(it.price);
      var q = parseFloat(it.qty);
      if (!isNaN(p) && !isNaN(q)) total += p * q;
    });
  }
  return total;
}

/* ── Globals ── */
var currentUser = null;
var isAdmin = false;
var chartDaily = null, chartStatus = null, chartCustomers = null;

/* ── Period change ── */
function onPeriodChange() {
  var v = document.getElementById('periodSelect').value;
  var cr = document.getElementById('customRange');
  if (v === 'custom') {
    cr.classList.add('show');
  } else {
    cr.classList.remove('show');
    loadDashboard();
  }
}

/* ── Apply i18n ── */
function applyLang() {
  document.getElementById('dbHeaderTitle').textContent = _t('db_title');
  document.getElementById('dbMinLabel').textContent = _t('db_title');
  document.getElementById('optThisMonth').textContent = _t('db_this_month');
  document.getElementById('optLastMonth').textContent = _t('db_last_month');
  document.getElementById('optThisQuarter').textContent = _t('db_this_quarter');
  document.getElementById('optCustom').textContent = _t('db_custom');
  document.getElementById('optAllEmp').textContent = _t('db_all_employees');
  document.getElementById('kpiLabelOrders').textContent = _t('db_total_orders');
  document.getElementById('kpiLabelRev').textContent = _t('db_revenue');
  document.getElementById('kpiLabelVisits').textContent = _t('db_visits');
  document.getElementById('kpiLabelAvg').textContent = _t('db_avg_order');
  document.getElementById('chartDailyTitle').textContent = _t('db_daily_orders');
  document.getElementById('chartStatusTitle').textContent = _t('db_status_dist');
  document.getElementById('chartCustTitle').textContent = _t('db_top_customers');
  document.getElementById('rankingTitle').textContent = _t('db_ranking');
  document.getElementById('thRank').textContent = _t('db_rank');
  document.getElementById('thName').textContent = _t('db_name');
  document.getElementById('thROrders').textContent = _t('db_total_orders');
  document.getElementById('thRRev').textContent = _t('db_revenue');
  document.getElementById('thRVisits').textContent = _t('db_visits');
  document.getElementById('thRAvg').textContent = _t('db_avg_order');
  document.getElementById('recentTitle').textContent = _t('db_recent');
  document.getElementById('recentNoData').textContent = _t('db_no_data');
}

/* ── Comparison helper ── */
function renderCmp(elId, cur, prev) {
  var el = document.getElementById(elId);
  if (prev === 0 && cur === 0) {
    el.innerHTML = '<span class="neutral">- ' + _t('db_vs_prev') + '</span>';
    return;
  }
  var pct;
  if (prev === 0) pct = 100;
  else pct = ((cur - prev) / prev * 100);
  var arrow, cls;
  if (pct > 0) { arrow = '▲'; cls = 'up'; }
  else if (pct < 0) { arrow = '▼'; cls = 'down'; }
  else { arrow = '→'; cls = 'neutral'; }
  el.innerHTML = '<span class="' + cls + '">' + arrow + ' ' + Math.abs(pct).toFixed(1) + '% ' + _t('db_vs_prev') + '</span>';
}

/* ── Status label ── */
function statusLabel(s) {
  var map = {pending:'db_pending',shipping:'db_shipping',done:'db_done',cancelled:'db_cancelled'};
  return _t(map[s] || 'db_pending');
}
function statusClass(s) {
  return 'status-' + (s || 'pending');
}

/* ── Load dashboard ── */
function loadDashboard() {
  var period = document.getElementById('periodSelect').value;
  var range, prevRange;
  if (period === 'custom') {
    var f = document.getElementById('dateFrom').value;
    var t = document.getElementById('dateTo').value;
    if (!f || !t) return;
    range = { from: new Date(f + 'T00:00:00'), to: new Date(t + 'T23:59:59') };
    var diff = range.to - range.from;
    prevRange = { from: new Date(range.from.getTime() - diff - 86400000), to: new Date(range.from.getTime() - 1) };
  } else {
    range = getDateRange(period);
    prevRange = getPrevRange(period);
  }

  var empVal = document.getElementById('empFilter').value;

  document.getElementById('dbLoading').style.display = 'flex';
  document.getElementById('dbDashboard').style.display = 'none';

  var fromStr = fmtDate(range.from);
  var toStr = fmtDate(range.to);
  var prevFromStr = prevRange ? fmtDate(prevRange.from) : '';
  var prevToStr = prevRange ? fmtDate(prevRange.to) : '';

  var ordersPromise = db.collection('orders')
    .where('date', '>=', fromStr)
    .where('date', '<=', toStr)
    .get();

  var prevOrdersPromise = prevRange ? db.collection('orders')
    .where('date', '>=', prevFromStr)
    .where('date', '<=', prevToStr)
    .get() : Promise.resolve(null);

  var visitsPromise = db.collection('visit_logs')
    .where('date', '>=', fromStr)
    .where('date', '<=', toStr)
    .get();

  var prevVisitsPromise = prevRange ? db.collection('visit_logs')
    .where('date', '>=', prevFromStr)
    .where('date', '<=', prevToStr)
    .get() : Promise.resolve(null);

  Promise.all([ordersPromise, prevOrdersPromise, visitsPromise, prevVisitsPromise])
    .then(function(results) {
      var ordersSnap = results[0];
      var prevOrdersSnap = results[1];
      var visitsSnap = results[2];
      var prevVisitsSnap = results[3];

      var allOrders = [];
      ordersSnap.forEach(function(doc) { allOrders.push(Object.assign({id: doc.id}, doc.data())); });

      var allPrevOrders = [];
      if (prevOrdersSnap) prevOrdersSnap.forEach(function(doc) { allPrevOrders.push(Object.assign({id: doc.id}, doc.data())); });

      var allVisits = [];
      visitsSnap.forEach(function(doc) { allVisits.push(Object.assign({id: doc.id}, doc.data())); });

      var allPrevVisits = [];
      if (prevVisitsSnap) prevVisitsSnap.forEach(function(doc) { allPrevVisits.push(Object.assign({id: doc.id}, doc.data())); });

      /* Employee filter */
      var orders = allOrders;
      var prevOrders = allPrevOrders;
      var visits = allVisits;
      var prevVisits = allPrevVisits;

      if (empVal !== 'all') {
        orders = orders.filter(function(o) { return o.user === empVal; });
        prevOrders = prevOrders.filter(function(o) { return o.user === empVal; });
        visits = visits.filter(function(v) { return v.empid === empVal; });
        prevVisits = prevVisits.filter(function(v) { return v.empid === empVal; });
      } else if (!isAdmin) {
        var uid = currentUser ? currentUser.empid : '';
        orders = orders.filter(function(o) { return o.user === uid; });
        prevOrders = prevOrders.filter(function(o) { return o.user === uid; });
        visits = visits.filter(function(v) { return v.empid === uid; });
        prevVisits = prevVisits.filter(function(v) { return v.empid === uid; });
      }

      /* Populate employee filter (admin only) */
      if (isAdmin) {
        var empSet = {};
        allOrders.forEach(function(o) {
          if (o.user) empSet[o.user] = o.user;
        });
        allVisits.forEach(function(v) {
          if (v.empid) empSet[v.empid] = v.emp_name || v.empid;
        });
        var sel = document.getElementById('empFilter');
        var curVal = sel.value;
        while (sel.options.length > 1) sel.remove(1);
        Object.keys(empSet).sort().forEach(function(k) {
          var opt = document.createElement('option');
          opt.value = k;
          opt.textContent = empSet[k];
          sel.appendChild(opt);
        });
        sel.value = curVal;
        sel.style.display = '';
      } else {
        document.getElementById('empFilter').style.display = 'none';
      }

      renderKPI(orders, prevOrders, visits, prevVisits);
      renderCharts(orders, range);
      renderRanking(allOrders, allVisits);
      renderRecent(orders);

      document.getElementById('dbLoading').style.display = 'none';
      document.getElementById('dbDashboard').style.display = '';
    })
    .catch(function(err) {
      console.error('Dashboard load error:', err);
      document.getElementById('dbLoading').style.display = 'none';
      document.getElementById('dbDashboard').style.display = '';
    });
}

/* ── KPI ── */
function renderKPI(orders, prevOrders, visits, prevVisits) {
  var totalOrders = orders.length;
  var prevTotalOrders = prevOrders.length;
  var revenue = 0;
  orders.forEach(function(o) { revenue += calcRevenue(o); });
  var prevRevenue = 0;
  prevOrders.forEach(function(o) { prevRevenue += calcRevenue(o); });
  var totalVisits = visits.length;
  var prevTotalVisits = prevVisits.length;
  var avgOrder = totalOrders > 0 ? revenue / totalOrders : 0;
  var prevAvg = prevTotalOrders > 0 ? prevRevenue / prevTotalOrders : 0;

  document.getElementById('kpiOrders').textContent = fmtNum(totalOrders);
  document.getElementById('kpiRevenue').textContent = _t('db_currency') + fmtNum(Math.round(revenue));
  document.getElementById('kpiVisits').textContent = fmtNum(totalVisits);
  document.getElementById('kpiAvg').textContent = _t('db_currency') + fmtNum(Math.round(avgOrder));

  /* Status breakdown */
  var sc = {pending:0, shipping:0, done:0, cancelled:0};
  orders.forEach(function(o) { var s = o.status || 'pending'; if (sc[s] !== undefined) sc[s]++; });
  document.getElementById('kpiOrdersBreak').textContent =
    statusLabel('pending') + ':' + sc.pending + ' / ' +
    statusLabel('shipping') + ':' + sc.shipping + ' / ' +
    statusLabel('done') + ':' + sc.done + ' / ' +
    statusLabel('cancelled') + ':' + sc.cancelled;

  renderCmp('kpiOrdersCmp', totalOrders, prevTotalOrders);
  renderCmp('kpiRevCmp', revenue, prevRevenue);
  renderCmp('kpiVisitsCmp', totalVisits, prevTotalVisits);
  renderCmp('kpiAvgCmp', avgOrder, prevAvg);
}

/* ── Charts ── */
function renderCharts(orders, range) {
  /* Daily orders */
  var dailyMap = {};
  var d = new Date(range.from);
  while (d <= range.to) {
    dailyMap[fmtDate(d)] = 0;
    d.setDate(d.getDate() + 1);
  }
  orders.forEach(function(o) {
    var dt = (o.date || '').substring(0, 10);
    if (dailyMap[dt] !== undefined) dailyMap[dt]++;
  });
  var dailyLabels = Object.keys(dailyMap).sort();
  var dailyData = dailyLabels.map(function(k) { return dailyMap[k]; });
  var shortLabels = dailyLabels.map(function(k) { return k.substring(5); });

  if (chartDaily) chartDaily.destroy();
  chartDaily = new Chart(document.getElementById('chartDaily'), {
    type: 'bar',
    data: {
      labels: shortLabels,
      datasets: [{
        label: _t('db_total_orders'),
        data: dailyData,
        backgroundColor: 'rgba(124,58,237,0.6)',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });

  /* Status doughnut */
  var sc = {pending:0, shipping:0, done:0, cancelled:0};
  orders.forEach(function(o) { var s = o.status || 'pending'; if (sc[s] !== undefined) sc[s]++; });
  if (chartStatus) chartStatus.destroy();
  chartStatus = new Chart(document.getElementById('chartStatus'), {
    type: 'doughnut',
    data: {
      labels: [statusLabel('pending'), statusLabel('shipping'), statusLabel('done'), statusLabel('cancelled')],
      datasets: [{
        data: [sc.pending, sc.shipping, sc.done, sc.cancelled],
        backgroundColor: ['#f59e0b','#3b82f6','#10b981','#ef4444'],
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { padding: 14, font: { size: 12 } } }
      }
    }
  });

  /* Top 10 customers */
  var custMap = {};
  orders.forEach(function(o) {
    var name = o.customer_name || o.customer_erp || 'Unknown';
    custMap[name] = (custMap[name] || 0) + 1;
  });
  var custArr = Object.keys(custMap).map(function(k) { return {name: k, cnt: custMap[k]}; });
  custArr.sort(function(a, b) { return b.cnt - a.cnt; });
  custArr = custArr.slice(0, 10);

  if (chartCustomers) chartCustomers.destroy();
  chartCustomers = new Chart(document.getElementById('chartCustomers'), {
    type: 'bar',
    data: {
      labels: custArr.map(function(c) { return c.name.length > 15 ? c.name.substring(0, 15) + '...' : c.name; }),
      datasets: [{
        label: _t('db_items'),
        data: custArr.map(function(c) { return c.cnt; }),
        backgroundColor: 'rgba(16,185,129,0.6)',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { stepSize: 1 } },
        y: { grid: { display: false } }
      }
    }
  });
}

/* ── Ranking ── */
function renderRanking(allOrders, allVisits) {
  if (!isAdmin) {
    document.getElementById('rankingSection').style.display = 'none';
    return;
  }
  document.getElementById('rankingSection').style.display = '';

  var empMap = {};
  allOrders.forEach(function(o) {
    var uid = o.user || 'unknown';
    if (!empMap[uid]) empMap[uid] = {name: uid, orders: 0, revenue: 0, visits: 0};
    empMap[uid].orders++;
    empMap[uid].revenue += calcRevenue(o);
  });
  allVisits.forEach(function(v) {
    var uid = v.empid || 'unknown';
    if (!empMap[uid]) empMap[uid] = {name: v.emp_name || uid, orders: 0, revenue: 0, visits: 0};
    empMap[uid].visits++;
    if (v.emp_name) empMap[uid].name = v.emp_name;
  });

  var arr = Object.keys(empMap).map(function(k) {
    var e = empMap[k];
    e.empid = k;
    e.avg = e.orders > 0 ? e.revenue / e.orders : 0;
    return e;
  });
  arr.sort(function(a, b) { return b.orders - a.orders; });

  var tbody = document.getElementById('rankingBody');
  tbody.innerHTML = '';
  var myId = currentUser ? currentUser.empid : '';
  arr.forEach(function(e, i) {
    var tr = document.createElement('tr');
    if (e.empid === myId) tr.className = 'my-row';
    tr.innerHTML =
      '<td class="rank-num">' + (i + 1) + '</td>' +
      '<td>' + e.name + '</td>' +
      '<td>' + fmtNum(e.orders) + '</td>' +
      '<td>' + _t('db_currency') + fmtNum(Math.round(e.revenue)) + '</td>' +
      '<td>' + fmtNum(e.visits) + '</td>' +
      '<td>' + _t('db_currency') + fmtNum(Math.round(e.avg)) + '</td>';
    tbody.appendChild(tr);
  });
}

/* ── Recent orders ── */
function renderRecent(orders) {
  var sorted = orders.slice().sort(function(a, b) {
    return (b.date || '').localeCompare(a.date || '');
  }).slice(0, 10);

  var tbody = document.getElementById('recentBody');
  tbody.innerHTML = '';

  if (sorted.length === 0) {
    document.getElementById('recentNoData').style.display = '';
    document.getElementById('recentNoData').textContent = _t('db_no_data');
    return;
  }
  document.getElementById('recentNoData').style.display = 'none';

  sorted.forEach(function(o) {
    var itemCount = (o.items && Array.isArray(o.items)) ? o.items.length : 0;
    var amount = calcRevenue(o);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (o.date || '-') + '</td>' +
      '<td>' + (o.customer_name || o.customer_erp || '-') + '</td>' +
      '<td>' + itemCount + ' ' + _t('db_items') + '</td>' +
      '<td>' + _t('db_currency') + fmtNum(Math.round(amount)) + '</td>' +
      '<td><span class="status-badge ' + statusClass(o.status) + '">' + statusLabel(o.status || 'pending') + '</span></td>';
    tbody.appendChild(tr);
  });
}

/* ── Init ── */
window.addEventListener('DOMContentLoaded', function() {
  currentUser = getCurrentUser();
  isAdmin = _isAdmin(currentUser);

  applyLang();

  /* Set default date inputs */
  var now = new Date();
  var firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
  document.getElementById('dateFrom').value = fmtDate(firstDay);
  document.getElementById('dateTo').value = fmtDate(now);

  loadDashboard();
});
</script>
