<style>
  body { margin:0; min-height:100vh; background:#f0f4f8; display:flex; flex-direction:column; }
  /* 헤더 바 — page-header.js가 .page-top-bar 기본 스타일 제공. expense 전용 padding만 오버라이드 */
  .expense-top-bar { padding:14px 20px; }
  /* 헤더 바 컨트롤 버튼 */
  .bar-ctrl { display:flex; align-items:center; gap:4px; }
  .bar-ctrl button {
    background:#f3f4f6; border:1px solid #e5e7eb; color:#374151; width:34px; height:30px;
    border-radius:6px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .bar-ctrl button:hover { background:#e5e7eb; }
  /* 영수증 제출: 전체 영역 */
  .expense-submit-area {
    flex:1; display:flex; flex-direction:column; background:#f0f4f8;
  }
  .expense-submit-area .receipt-overlay { position:static !important; display:block !important; z-index:auto !important; background:none !important; }
  /* 영수증 조회: 전체 영역 */
  .expense-admin-area {
    flex:1; display:flex; flex-direction:column;
  }
  .expense-admin-area .receipt-overlay { position:static !important; display:flex !important; z-index:auto !important; background:none !important; flex:1; flex-direction:column; }
  .expense-admin-area .receipt-admin-modal { max-width:100% !important; width:100% !important; flex:1; max-height:none !important; border-radius:0 !important; box-shadow:none !important; margin:0 !important; }
  .expense-admin-area .receipt-hdr { display:none !important; }
  /* 최소화 바 */
  .expense-mini-bar {
    display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#d97706; color:#fff; padding:10px 24px; border-radius:20px;
    font-size:13px; font-weight:700; cursor:pointer; z-index:99999;
    box-shadow:0 4px 15px rgba(0,0,0,.3); align-items:center; gap:8px;
  }
  .expense-mini-bar.show { display:flex; }
  /* 축소(복원) 모드 */
  .expense-admin-area.restored {
    position:fixed; bottom:60px; right:20px; width:700px; height:550px;
    box-shadow:0 8px 30px rgba(0,0,0,.3); border-radius:0 0 12px 12px; overflow:hidden; z-index:9999;
  }
  .expense-top-bar.floating {
    position:fixed; bottom:calc(60px + 550px); right:20px; width:700px; top:auto;
    border-radius:12px 12px 0 0; border-bottom:1px solid #d1d5db;
    box-shadow:0 -4px 15px rgba(0,0,0,.1); cursor:grab;
  }
  .expense-top-bar.floating:active { cursor:grabbing; }
  @media (max-width:700px) {
    body { padding-top:50px; }
    .bar-ctrl { display:none !important; }
    #expBarBackBtn { display:inline-flex !important; }
    .expense-admin-area.restored { width:calc(100% - 20px); right:10px; bottom:10px; height:50vh; }
    .expense-top-bar.floating { width:calc(100% - 20px); right:10px; bottom:calc(10px + 50vh); }
  }
</style>

<!-- Firebase 초기화 + 유틸 (shared via firebase-init.js) -->
<script src="firebase-init.js?v=1"></script>
<script>
var _fbAuth = firebase.auth();
var _fbDb   = firebase.firestore();
var _fbStorage = firebase.storage();

function getCurrentUser() {
  var u = JSON.parse(sessionStorage.getItem('current_user') || 'null');
  if (u) return u;
  if (localStorage.getItem('auto_login') === 'true') {
    return JSON.parse(localStorage.getItem('current_user_persist') || 'null');
  }
  return null;
}

function neoAlert(msg) {
  var ov = document.getElementById('neoAlertOverlay');
  var msgEl = document.getElementById('neoAlertMsg');
  if (ov && msgEl) { msgEl.textContent = msg; ov.style.display = 'flex'; }
  else alert(msg);
}

function showToast(msg) {
  var c = document.getElementById('toastContainer');
  if (!c) return;
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.2);';
  c.appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(function(){ d.remove(); },300); }, 2500);
}

function _bringToFront(el) {}
function _hideMobileBackground() {}
function _showMobileBackground() {}
function _repositionMinis() {}
function _resetModalPos() {}
function toggleModalFullscreen() {}
function modalToggleFS() {}
function _initReceiptAdminDrag() {}

// 돌아가기: 영수증 조회 시작 화면으로 복귀
function _expGoBack() {
  // 선택된 월이 있으면 → 직원 목록으로
  if (typeof _radSelected !== 'undefined' && _radSelected.ym) {
    _radSelected.ym = '';
    _loadReceiptDashboard();
    return;
  }
  // 선택된 직원이 있으면 → 전체 목록으로
  if (typeof _radSelected !== 'undefined' && _radSelected.empid) {
    _radSelected.empid = '';
    _radSelected.ym = '';
    _loadReceiptDashboard();
    return;
  }
  // 월간 필터가 있으면 → 전체 월로 리셋 후 새로고침
  if (typeof _radFilterYm !== 'undefined' && _radFilterYm) {
    _radFilterYm = '';
    _radSelected = { empid: '', ym: '' };
    _loadReceiptDashboard();
    return;
  }
  // 이미 시작 화면이면 → 전체 초기화 후 새로고침
  _radFilterYm = '';
  _radSelected = { empid: '', ym: '' };
  _radSubmitFilter = 'all';
  _loadReceiptDashboard();
}

// expense.html 전용: 최소화/최대화/복원/닫기
var _expIsFS = true;
function _expMinimize() {
  document.getElementById('expenseAdminPage').style.display = 'none';
  document.getElementById('expenseTopBar').style.display = 'none';
  document.getElementById('expenseMiniBar').classList.add('show');
}
function _expRestore() {
  document.getElementById('expenseMiniBar').classList.remove('show');
  var bar = document.getElementById('expenseTopBar');
  bar.style.display = '';
  document.getElementById('expenseAdminPage').style.display = 'flex';
  _expIsFS = true;
  document.getElementById('expenseAdminPage').classList.remove('restored');
  bar.classList.remove('floating');
  document.getElementById('expBarFsBtn').innerHTML = '&#x2750;';
  document.getElementById('expBarFsBtn').title = '축소';
}
function _expToggleFS() {
  var page = document.getElementById('expenseAdminPage');
  var bar = document.getElementById('expenseTopBar');
  var btn = document.getElementById('expBarFsBtn');
  _expIsFS = !_expIsFS;
  if (_expIsFS) {
    page.classList.remove('restored');
    bar.classList.remove('floating');
    bar.style.right = ''; bar.style.bottom = '';
    page.style.right = ''; page.style.bottom = '';
    btn.innerHTML = '&#x2750;'; btn.title = '축소';
  } else {
    page.classList.add('restored');
    bar.classList.add('floating');
    btn.innerHTML = '&#x26F6;'; btn.title = '전체화면';
  }
}

// 헤더 드래그 이동 (축소 모드에서만)
(function() {
  var bar = document.getElementById('expenseTopBar');
  var dragging = false, startX, startY, startRight, startBottom;
  bar.addEventListener('mousedown', function(e) {
    if (!bar.classList.contains('floating')) return;
    if (e.target.tagName === 'BUTTON' || e.target.closest('.bar-ctrl')) return;
    dragging = true; startX = e.clientX; startY = e.clientY;
    startRight = parseInt(bar.style.right || getComputedStyle(bar).right) || 20;
    startBottom = parseInt(bar.style.bottom || getComputedStyle(bar).bottom) || 0;
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    var newRight = startRight - dx, newBottom = startBottom - dy;
    var barW = bar.offsetWidth, page = document.getElementById('expenseAdminPage');
    var pageH = page ? page.offsetHeight : 550;
    if (newRight < 0) newRight = 0;
    if (newRight > window.innerWidth - barW) newRight = window.innerWidth - barW;
    if (newBottom + bar.offsetHeight + pageH > window.innerHeight) newBottom = window.innerHeight - bar.offsetHeight - pageH;
    if (newBottom < 0) newBottom = 0;
    bar.style.right = newRight + 'px'; bar.style.bottom = (newBottom + pageH) + 'px';
    page.style.right = newRight + 'px'; page.style.bottom = newBottom + 'px';
  });
  document.addEventListener('mouseup', function() { dragging = false; });
  bar.addEventListener('touchstart', function(e) {
    if (!bar.classList.contains('floating')) return;
    if (e.target.tagName === 'BUTTON' || e.target.closest('.bar-ctrl')) return;
    var t = e.touches[0]; dragging = true; startX = t.clientX; startY = t.clientY;
    startRight = parseInt(bar.style.right || getComputedStyle(bar).right) || 20;
    startBottom = parseInt(bar.style.bottom || getComputedStyle(bar).bottom) || 0;
  }, {passive:true});
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    var t = e.touches[0], dx = t.clientX - startX, dy = t.clientY - startY;
    var newRight = startRight - dx, newBottom = startBottom - dy;
    var barW = bar.offsetWidth, pageEl = document.getElementById('expenseAdminPage');
    var pageH = pageEl ? pageEl.offsetHeight : 550;
    if (newRight < 0) newRight = 0;
    if (newRight > window.innerWidth - barW) newRight = window.innerWidth - barW;
    if (newBottom + bar.offsetHeight + pageH > window.innerHeight) newBottom = window.innerHeight - bar.offsetHeight - pageH;
    if (newBottom < 0) newBottom = 0;
    bar.style.right = newRight + 'px'; bar.style.bottom = (newBottom + pageH) + 'px';
    pageEl.style.right = newRight + 'px'; pageEl.style.bottom = newBottom + 'px';
  }, {passive:true});
  document.addEventListener('touchend', function() { dragging = false; });
  bar.addEventListener('dblclick', function(e) {
    if (e.target.tagName === 'BUTTON' || e.target.closest('.bar-ctrl')) return;
    if (!_expIsFS) {
      _expToggleFS();
      bar.style.right = ''; bar.style.bottom = '';
      var page = document.getElementById('expenseAdminPage');
      if (page) { page.style.right = ''; page.style.bottom = ''; }
    }
  });
})();

// GPU 가속 (expense.html에서는 불필요하므로 빈 함수)
function _applyGpuAccel() {}

var MENU_CONFIG_ITEMS = [];
var HARDCODED_ADMINS = ['T2408087'];
function _isAdmin(u) {
  if (!u) return false;
  return HARDCODED_ADMINS.includes(u.empid) || u.role === 'admin';
}
function _ensurePermArray(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v) { try { var p = JSON.parse(v); if (Array.isArray(p)) return p; } catch(e) {} }
  return [];
}

// account.js의 apiGetAccounts 심
var _acctCache = [];
async function apiGetAccounts() {
  if (_acctCache.length) return { accounts: _acctCache };
  try {
    var snap = await _fbDb.collection('accounts').get();
    var arr = []; snap.forEach(function(d) { var o = d.data(); o._id = d.id; arr.push(o); });
    _acctCache = arr;
    return { accounts: arr };
  } catch(e) { return { accounts: [] }; }
}
</script>
<!-- expense.js -->
<script src="expense.min.js?v=154"></script>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') || 'submit';
  var L = (typeof currentLang !== 'undefined') ? currentLang : 'ko';
  var titleEl = document.getElementById('expenseBarTitle');
  var isMobile = window.innerWidth <= 700;

  if (mode === 'admin') {
    document.getElementById('expenseAdminPage').style.display = 'flex';
    if (!isMobile) {
      document.getElementById('expBarCtrlBtns').style.display = 'flex';
      document.getElementById('expBarBackBtn').style.display = 'none';
    } else {
      document.getElementById('expBarCtrlBtns').style.display = 'none';
      document.getElementById('expBarBackBtn').style.display = '';
    }
    if (titleEl) {
      var titles = { ko:'📋 영수증 조회', en:'📋 Receipt Dashboard', th:'📋 ตรวจสอบใบเสร็จ' };
      titleEl.textContent = titles[L] || titles.ko;
    }
    // 관리자 대시보드 초기화
    var tEl = document.getElementById('receiptAdminTitleText');
    if (tEl) tEl.textContent = _isExpenseAdmin() ? t('receipt_admin_title') : t('receipt_view_title');
    _loadReceiptDashboard();
  } else {
    document.getElementById('expenseSubmitPage').style.display = 'flex';
    // 영수증 제출용 receiptOverlay를 보이게
    var ov = document.getElementById('receiptOverlay');
    if (ov) ov.style.display = 'block';
    if (titleEl) {
      var titles = { ko:'🧾 영수증 제출', en:'🧾 Receipt Submit', th:'🧾 ส่งใบเสร็จ' };
      titleEl.textContent = titles[L] || titles.ko;
    }
  }

  // Firebase Auth 복원
  var user = getCurrentUser();
  if (user && user.empid) {
    var email = user.empid + '@neothai-order.firebaseapp.com';
    var pw = user.pw_hash || user.pw || user.empid;
    _fbAuth.signInWithEmailAndPassword(email, pw).catch(function(err) {
      if (err.code === 'auth/user-not-found') {
        _fbAuth.createUserWithEmailAndPassword(email, pw).catch(function(){});
      }
    });
  }
  applyLang();
})();
</script>
