<script src="lang.min.js?v=161"></script>
<!-- 공용 페이지 헤더 (시범 적용) -->
<script src="page-header.js?v=2"></script>
<!-- Firebase 초기화 + 유틸 (shared via firebase-init.js) -->
<script src="firebase-init.js?v=1"></script>
<script>
var _fbDb = firebase.firestore();

// Firebase Auth persistence (IndexedDB) 복원을 기다린다.
// fuel.html 은 별도 탭/팝업으로 열 수 있는데, 열자마자 Callable Functions 를 부르면
// auth 가 아직 복원 안 되어 서버가 context.auth=null 로 "unauthenticated" 를 돌려준다.
// 이 헬퍼로 매 호출 직전에 auth 복원을 확인.
function _fuelWaitForFbAuth(timeoutMs) {
  return new Promise(function(resolve) {
    try {
      if (firebase.auth && firebase.auth().currentUser) { resolve(firebase.auth().currentUser); return; }
      var done = false;
      var unsub = firebase.auth().onAuthStateChanged(function(u) {
        if (done) return;
        done = true;
        try { unsub(); } catch(e){}
        resolve(u || null);
      });
      setTimeout(function() {
        if (done) return;
        done = true;
        try { unsub(); } catch(e){}
        resolve(firebase.auth().currentUser || null);
      }, timeoutMs || 5000);
    } catch(e) { resolve(null); }
  });
}

function showToast(msg) {
  var c = document.getElementById('toastContainer');
  if (!c) return;
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.2);';
  c.appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(function(){ d.remove(); },300); }, 2500);
}

// ── 창 컨트롤 ──
function _fuelMinimize() {
  if (window.opener && !window.opener.closed) {
    window.close();
  } else {
    history.back();
  }
}
var _fuelIsFs = false;
function _fuelToggleFs() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
    _fuelIsFs = true;
  } else {
    document.exitFullscreen();
    _fuelIsFs = false;
  }
}

// ── 주유 가격 로직 ──
var _fuelCache = null;
var _fuelCacheTime = 0;
var _fuelHistCache = {};
var _fuelTab = 'current';
var _fuelMonthCache = {};

function _fuelSwitchTab(tab) {
  _fuelTab = tab;
  var tabs = ['fuelTabCurrent','fuelTabHistory','fuelTabMonthly'];
  var activeId = tab === 'current' ? 'fuelTabCurrent' : tab === 'history' ? 'fuelTabHistory' : 'fuelTabMonthly';
  tabs.forEach(function(id) {
    var el = document.getElementById(id);
    if (id === activeId) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
  if (tab === 'current') _loadFuelPrice();
  else if (tab === 'history') _showFuelHistory();
  else _showFuelMonthly();
}

// ── 현재 가격 (전 브랜드) ──
async function _loadFuelPrice() {
  var body = document.getElementById('fuelPriceBody');
  var now = Date.now();
  if (_fuelCache && (now - _fuelCacheTime < 600000)) {
    _renderFuelPrice(_fuelCache);
    return;
  }
  body.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af;">⛽ ' + t('fuel_loading') + '</div>';
  try {
    var resp = await fetch('https://api.chnwt.dev/thai-oil-api/latest');
    var data = await resp.json();
    if (data.status === 'success' && data.response) {
      _fuelCache = data.response;
      _fuelCacheTime = now;
      _renderFuelPrice(data.response);
    } else {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">⚠️ ' + t('fuel_fail') + '</div>';
    }
  } catch(e) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">⚠️ ' + t('fuel_fail') + ': ' + e.message + '</div>';
  }
}

// ── 이전 가격 UI (날짜 선택) ──
function _showFuelHistory() {
  var body = document.getElementById('fuelPriceBody');
  var today = new Date();
  var defDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var html = '<div style="text-align:center;margin-bottom:16px;">';
  html += '<label style="font-size:14px;font-weight:600;color:#374151;">📅 ' + t('fuel_hist_select') + '</label><br>';
  html += '<input type="date" id="fuelHistDate" value="' + defDate + '" max="' + defDate + '" style="margin-top:8px;padding:8px 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;color:#374151;cursor:pointer;" />';
  html += ' <button onclick="_loadFuelHistory()" style="margin-left:8px;padding:8px 18px;background:#f97316;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">🔍 ' + t('fuel_hist_search') + '</button>';
  html += '</div>';
  html += '<div id="fuelHistResult" style="color:#9ca3af;text-align:center;padding:20px;font-size:14px;">' + t('fuel_hist_guide') + '</div>';
  body.innerHTML = html;
}

// ── PTT SOAP API로 이전 가격 조회 ──
async function _loadFuelHistory() {
  var dateVal = document.getElementById('fuelHistDate').value;
  if (!dateVal) return;
  var parts = dateVal.split('-');
  var dd = parts[2], mm = parts[1], yyyy = parts[0];
  var resultEl = document.getElementById('fuelHistResult');
  resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#9ca3af;">⛽ ' + t('fuel_loading') + '</div>';

  if (_fuelHistCache[dateVal]) {
    _renderFuelHistory(_fuelHistCache[dateVal], dateVal);
    return;
  }

  try {
    var _u = await _fuelWaitForFbAuth(6000);
    if (!_u) {
      resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_fail') + ': 로그인 세션이 복원되지 않았습니다. 메인 앱에서 로그인 후 다시 시도해 주세요.</div>';
      return;
    }
    var callFn = firebase.functions().httpsCallable('getPttOilPrice');
    var result = await callFn({ dd: dd, mm: mm, yyyy: yyyy });
    var r = result.data;
    if (r.success && r.items && r.items.length) {
      var histData = { items: r.items, priceDate: r.priceDate || dateVal };
      _fuelHistCache[dateVal] = histData;
      _renderFuelHistory(histData, dateVal);
    } else {
      resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_hist_nodata') + '</div>';
    }
  } catch(e) {
    resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_fail') + ': ' + e.message + '</div>';
  }
}

// 이전 가격 렌더링
function _renderFuelHistory(histData, dateVal) {
  var items = histData.items || histData;
  var priceDate = histData.priceDate || dateVal;
  var resultEl = document.getElementById('fuelHistResult');
  var L = (typeof currentLang !== 'undefined') ? currentLang : 'ko';
  var html = '<div style="text-align:center;margin-bottom:12px;">';
  html += '<div style="font-size:14px;font-weight:600;color:#374151;">📅 ' + t('fuel_hist_date_label') + ': ' + priceDate + '</div>';
  if (priceDate !== dateVal) {
    html += '<div style="font-size:12px;color:#9ca3af;margin-top:4px;">(' + t('fuel_hist_nearest') + ' ' + dateVal + ')</div>';
  }
  html += '</div>';
  html += '<div style="border:1.5px solid #e5e7eb;border-radius:12px;overflow:hidden;">';
  html += '<div style="padding:10px 16px;background:#1d4ed8;color:#fff;font-size:15px;font-weight:700;">PTT ' + t('fuel_hist_title') + '</div>';
  items.forEach(function(item, idx) {
    var bg = idx % 2 === 0 ? '#fff' : '#f9fafb';
    html += '<div style="padding:10px 16px;background:' + bg + ';border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;">';
    html += '<span style="font-size:13px;color:#374151;">' + item.name + '</span>';
    html += '<span style="font-size:15px;font-weight:700;color:#1d4ed8;">' + item.price.toFixed(2) + ' ฿</span>';
    html += '</div>';
  });
  html += '</div>';

  // 현재 가격과 비교 (PTT만)
  if (_fuelCache && _fuelCache.stations && _fuelCache.stations.ptt) {
    var pttNow = _fuelCache.stations.ptt;
    var hasCompare = false;
    var compHtml = '<div style="margin-top:14px;border:1.5px solid #e5e7eb;border-radius:12px;overflow:hidden;">';
    compHtml += '<div style="padding:10px 16px;background:#374151;color:#fff;font-size:14px;font-weight:700;">📊 ' + t('fuel_hist_compare') + '</div>';
    items.forEach(function(item, idx) {
      var matchKey = null;
      // 1차: 정확한 이름 매칭
      Object.keys(pttNow).forEach(function(k) {
        if (pttNow[k].name && pttNow[k].name === item.name) matchKey = k;
      });
      // 2차: 정규화된 키 매칭 (Diesel ≠ Diesel B20 구분)
      if (!matchKey) {
        var lname = item.name.toLowerCase().replace(/\s+/g, ' ').trim();
        // 정확한 키 매핑 테이블
        var _fuelKeyMap = [
          { pattern: /diesel\s*b\s*20|ดีเซล\s*b\s*20/i, key: 'diesel_b20' },
          { pattern: /diesel\s*b\s*7|ดีเซล\s*b\s*7/i, key: 'diesel_b7' },
          { pattern: /premium\s*diesel|ดีเซล\s*พรีเมียม/i, key: 'premium_diesel' },
          { pattern: /^diesel$|^ดีเซล$/i, key: 'diesel' },
          { pattern: /gasohol\s*95|แก๊สโซฮอล์\s*95|e10\s*95|เบนซิน\s*95/i, key: 'gasohol_95' },
          { pattern: /gasohol\s*91|แก๊สโซฮอล์\s*91|e10\s*91|เบนซิน\s*91/i, key: 'gasohol_91' },
          { pattern: /gasohol\s*e\s*85|แก๊สโซฮอล์\s*e\s*85/i, key: 'gasohol_e85' },
          { pattern: /gasohol\s*e\s*20|แก๊สโซฮอล์\s*e\s*20/i, key: 'gasohol_e20' },
          { pattern: /ngv|เอ็นจีวี/i, key: 'ngv' }
        ];
        for (var mi = 0; mi < _fuelKeyMap.length; mi++) {
          if (_fuelKeyMap[mi].pattern.test(lname) && pttNow[_fuelKeyMap[mi].key]) {
            matchKey = _fuelKeyMap[mi].key;
            break;
          }
        }
        // 3차: 기존 부분 매칭 (위에서 못 찾은 경우)
        if (!matchKey) {
          Object.keys(pttNow).forEach(function(k) {
            var pn = (pttNow[k].name || '').toLowerCase();
            if (!matchKey && pn && lname === pn) matchKey = k;
          });
        }
      }
      if (matchKey && pttNow[matchKey].price && pttNow[matchKey].price !== '-') {
        hasCompare = true;
        var nowPrice = parseFloat(pttNow[matchKey].price);
        var diff = nowPrice - item.price;
        var diffColor = diff > 0 ? '#ef4444' : diff < 0 ? '#16a34a' : '#6b7280';
        var diffIcon = diff > 0 ? '▲' : diff < 0 ? '▼' : '—';
        var bg = idx % 2 === 0 ? '#fff' : '#f9fafb';
        compHtml += '<div style="padding:8px 16px;background:' + bg + ';border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:8px;font-size:13px;">';
        compHtml += '<span style="flex:1;color:#374151;">' + item.name + '</span>';
        compHtml += '<span style="color:#6b7280;">' + item.price.toFixed(2) + '</span>';
        compHtml += '<span style="color:#9ca3af;">→</span>';
        compHtml += '<span style="font-weight:700;">' + nowPrice.toFixed(2) + '</span>';
        compHtml += '<span style="font-weight:700;color:' + diffColor + ';">' + diffIcon + ' ' + Math.abs(diff).toFixed(2) + '</span>';
        compHtml += '</div>';
      }
    });
    compHtml += '</div>';
    if (hasCompare) html += compHtml;
  }

  resultEl.innerHTML = html;
}

// ── 월별 요약 ──
function _showFuelMonthly() {
  var body = document.getElementById('fuelPriceBody');
  var now = new Date();
  var defMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  var html = '<div style="text-align:center;margin-bottom:16px;">';
  html += '<label style="font-size:14px;font-weight:600;color:#374151;">📅 ' + t('fuel_monthly_select') + '</label><br>';
  html += '<input type="month" id="fuelMonthInput" value="' + defMonth + '" style="margin-top:8px;padding:8px 14px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;color:#374151;cursor:pointer;" />';
  html += ' <button onclick="_loadFuelMonthly()" style="margin-left:8px;padding:8px 18px;background:#f97316;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">🔍 ' + t('fuel_hist_search') + '</button>';
  html += '</div>';
  html += '<div id="fuelMonthResult" style="color:#9ca3af;text-align:center;padding:20px;font-size:14px;">' + t('fuel_monthly_guide') + '</div>';
  body.innerHTML = html;
}

async function _loadFuelMonthly() {
  var monthVal = document.getElementById('fuelMonthInput').value;
  if (!monthVal) return;
  var parts = monthVal.split('-');
  var yyyy = parts[0], mm = parts[1];
  var resultEl = document.getElementById('fuelMonthResult');
  resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#9ca3af;">⛽ ' + t('fuel_monthly_loading') + '</div>';

  if (_fuelMonthCache[monthVal]) {
    _renderFuelMonthly(_fuelMonthCache[monthVal], monthVal);
    return;
  }

  try {
    var _u = await _fuelWaitForFbAuth(6000);
    if (!_u) {
      resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_fail') + ': 로그인 세션이 복원되지 않았습니다. 메인 앱에서 로그인 후 다시 시도해 주세요.</div>';
      return;
    }
    var callFn = firebase.functions().httpsCallable('getPttMonthly', { timeout: 60000 });
    var result = await callFn({ mm: mm, yyyy: yyyy });
    var r = result.data;
    if (r.success && r.announcements && r.announcements.length) {
      _fuelMonthCache[monthVal] = r;
      _renderFuelMonthly(r, monthVal);
    } else {
      resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_hist_nodata') + '</div>';
    }
  } catch(e) {
    resultEl.innerHTML = '<div style="text-align:center;padding:30px;color:#ef4444;">⚠️ ' + t('fuel_fail') + ': ' + e.message + '</div>';
  }
}

function _renderFuelMonthly(data, monthVal) {
  var resultEl = document.getElementById('fuelMonthResult');
  var ann = data.announcements;
  var html = '';

  // 요약 카드
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">';
  html += '<div style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:12px;padding:14px;text-align:center;">';
  html += '<div style="font-size:24px;font-weight:700;color:#1d4ed8;">' + ann.length + '</div>';
  html += '<div style="font-size:12px;color:#6b7280;">' + t('fuel_monthly_count') + '</div></div>';

// ── 당월 유류 지원금 로드 (전월 Gasohol 95 평균 기준) ──
async function _loadCurrentMonthSubsidy() {
  var el = document.getElementById('fuelSubsidyTag');
  if (!el) return;
  var L = (typeof currentLang !== 'undefined') ? currentLang : 'ko';
  // 전월 계산
  var nowIct = new Date(new Date().getTime() + 7 * 3600000);
  var prevDate = new Date(nowIct.getFullYear(), nowIct.getMonth() - 1, 1);
  var yyyy = String(prevDate.getFullYear());
  var mm = String(prevDate.getMonth() + 1).padStart(2, '0');
  var monthVal = yyyy + '-' + mm;

  var cached = _fuelMonthCache[monthVal];
  if (!cached) {
    try {
      var _u = await _fuelWaitForFbAuth(6000);
      if (!_u) return; // 조용히 스킵 — subsidy 는 부가 표시라 로그인 유도 배너 안 띄움
      var callFn = firebase.functions().httpsCallable('getPttMonthly', { timeout: 60000 });
      var result = await callFn({ mm: mm, yyyy: yyyy });
      var r = result.data;
      if (r.success && r.announcements && r.announcements.length) {
        _fuelMonthCache[monthVal] = r;
        cached = r;
      }
    } catch(e) { return; }
  }
  if (!cached || !cached.announcements) return;

  var ann = cached.announcements;
  var g95sum = 0, g95cnt = 0;
  ann.forEach(function(a) {
    a.items.forEach(function(item) {
      if (item.name === 'Gasohol 95' || item.name.indexOf('Gasohol 95') >= 0) {
        g95sum += item.price;
        g95cnt++;
      }
    });
  });
  if (g95cnt === 0) return;
  var g95avg = (g95sum / g95cnt).toFixed(2);
  var g95num = parseFloat(g95avg);
  var rate = '-';
  if (g95num <= 35) rate = 5;
  else if (g95num <= 40) rate = 6;
  else rate = 7;

  var labels = {
    ko: '당월 유류 지원금: ' + rate + ' ฿/km',
    en: 'Fuel Subsidy: ' + rate + ' ฿/km',
    th: 'เงินช่วยเหลือน้ำมัน: ' + rate + ' ฿/km'
  };
  el.innerHTML = '<span style="background:#15803d;color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;">⛽ ' + (labels[L] || labels.en) + '</span>';
}

// ── 연료 이름 → 표준 키 정규화 (API 키는 신뢰 불가, name 필드 기준) ──
function _fuelCanonicalKey(name) {
  if (!name) return null;
  var n = String(name).toLowerCase().replace(/\s+/g, ' ').trim();
  // Diesel 계열 (더 구체적인 것부터)
  if (/premium\s*diesel|ดีเซล\s*พรีเมียม|ดีเซลพรีเมียม/.test(n)) return 'premium_diesel';
  if (/diesel\s*b\s*20|ดีเซล\s*b\s*20/.test(n)) return 'diesel_b20';
  if (/diesel\s*b\s*7|ดีเซล\s*b\s*7/.test(n)) return 'diesel_b7';
  if (/^diesel$|^ดีเซล$/.test(n)) return 'diesel';
  // Premium Gasohol 95 (Shell V-Power 등) — 일반 Gasohol 95 보다 먼저
  if (/v[- ]?power.*gasohol\s*95|วี[- ]?เพาเวอร์.*แก๊สโซฮอล์\s*95|เชลล์.*แก๊สโซฮอล์\s*95|premium\s*gasohol\s*95|พรีเมียม.*แก๊สโซฮอล์\s*95/.test(n)) return 'vpower_gasohol_95';
  // 순수 휘발유 (에탄올 무함유) — Gasohol 보다 먼저
  if (/^(?:benzine|gasoline|ul)\s*95$|^เบนซิน\s*95$/.test(n)) return 'gasoline_95';
  if (/^(?:benzine|gasoline|ul)\s*91$|^เบนซิน\s*91$/.test(n)) return 'gasoline_91';
  // Gasohol (에탄올 혼합)
  if (/gasohol\s*e\s*85|แก๊สโซฮอล์\s*e\s*85/.test(n)) return 'gasohol_e85';
  if (/gasohol\s*e\s*20|แก๊สโซฮอล์\s*e\s*20/.test(n)) return 'gasohol_e20';
  if (/gasohol\s*95|แก๊สโซฮอล์\s*95|e10\s*95/.test(n)) return 'gasohol_95';
  if (/gasohol\s*91|แก๊สโซฮอล์\s*91|e10\s*91/.test(n)) return 'gasohol_91';
  // NGV
  if (/ngv|เอ็นจีวี/.test(n)) return 'ngv';
  return null;
}

    'https://maps.mail.ru/osm/tools/overpass/api/interpreter'

function _nbGetBrandColor(text) {
  var low = (text || '').toLowerCase();
  for (var i = 0; i < _nbBrands.length; i++) {
    for (var j = 0; j < _nbBrands[i].keys.length; j++) {
      if (low.indexOf(_nbBrands[i].keys[j]) >= 0) return { color: _nbBrands[i].color, label: _nbBrands[i].label };
    }
  }
  return { color: _nbOtherColor, label: '' };
}

var _excludeNames = ['7-eleven','7-11','seven eleven','เซเว่น','familymart','แฟมิลี่มาร์ท','lawson','mini big c','tesco','lotus','makro','big c'];
function _isRealStation(tags, name, brand) {
  var combined = ((name || '') + ' ' + (brand || '')).toLowerCase();
  for (var i = 0; i < _excludeNames.length; i++) {
    if (combined.indexOf(_excludeNames[i]) >= 0) return false;
  }
  if (tags.shop === 'convenience') return false;
  return true;
}

function _processNearbyData(data, lat, lng, loadEl, L) {
  loadEl.style.display = 'none';

    if (!elLat || !elLng) return null;
    var tags = el.tags || {};
    var name = tags.name || tags['name:th'] || tags['name:en'] || tags.brand || tags.operator || '';
    var brand = tags.brand || tags.operator || '';
    if (!_isRealStation(tags, name, brand)) return null;
    var dist = _haversine(lat, lng, elLat, elLng);
    var bc = _nbGetBrandColor(brand || name);
    return { lat: elLat, lng: elLng, name: name, brand: brand, dist: dist, tags: tags, color: bc.color, brandLabel: bc.label || _nbOtherLabel };
  }).filter(function(s) { return s !== null; });

  _nbAllStations.sort(function(a, b) { return a.dist - b.dist; });

// Haversine 거리 계산 (km)
function _haversine(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

    document.body.appendChild(_ptrEl);
  }
  var _ptrRelease = { ko:'놓으면 새로고침', en:'Release to refresh', th:'ปล่อยเพื่อรีเฟรช' }[L] || '놓으면 새로고침';
  var _ptrPull = { ko:'당겨서 새로고침', en:'Pull to refresh', th:'ดึงเพื่อรีเฟรช' }[L] || '당겨서 새로고침';
  var _ptrLoading = { ko:'새로고침 중...', en:'Refreshing...', th:'กำลังรีเฟรช...' }[L] || '새로고침 중...';

  document.addEventListener('touchstart', function(e) {
    var hdr = document.querySelector('.fuel-header');
    if (!hdr || !hdr.contains(e.target)) return;
    // 주유소 찾기 오버레이가 열려있으면 그쪽 헤더에서 pull 방지
    var nbOv = document.getElementById('nearbyStationOverlay');
    if (nbOv && nbOv.style.display === 'flex') return;
    _ptrStartY = e.touches[0].clientY;
    _ptrDist = 0;
    _ptrActive = true;
    _createPtr();
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!_ptrActive) return;
    _ptrDist = e.touches[0].clientY - _ptrStartY;
    if (_ptrDist < 0) { _ptrDist = 0; return; }
    var prog = Math.min(_ptrDist / _ptrThreshold, 1);
    var ty = Math.min(_ptrDist * 0.5, 50);
    if (_ptrEl) {
      _ptrEl.style.transform = 'translateX(-50%) translateY(' + (ty - 10) + 'px)';
      var arrow = document.getElementById('fuelPtrArrow');
      var txt = document.getElementById('fuelPtrText');
      if (prog >= 1) {
        if (arrow) arrow.style.transform = 'rotate(180deg)';
        if (txt) txt.textContent = _ptrRelease;
      } else {
        if (arrow) arrow.style.transform = 'rotate(0deg)';
        if (txt) txt.textContent = _ptrPull;
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', function() {
    if (!_ptrActive) return;
    _ptrActive = false;
    if (_ptrDist >= _ptrThreshold) {
      if (_ptrEl) {
        var txt = document.getElementById('fuelPtrText');
        var arrow = document.getElementById('fuelPtrArrow');
        if (txt) txt.textContent = _ptrLoading;
        if (arrow) { arrow.innerHTML = '⟳'; arrow.style.animation = 'ptrSpin .6s linear infinite'; }
      }
      setTimeout(function() {
        // 현재 탭 데이터 새로고침
        _fuelCache = null; _fuelCacheTime = 0;
        _fuelSwitchTab(_fuelTab);
        // 주유소 찾기가 열려있으면 함께 새로고침
        var nbOv = document.getElementById('nearbyStationOverlay');
        if (nbOv && nbOv.style.display === 'flex') {
          _refreshNearbyStations();
        }
        // 인디케이터 숨기기
        if (_ptrEl) _ptrEl.style.transform = 'translateX(-50%) translateY(-50px)';
        showToast('🔄 ' + ({ ko:'새로고침 완료', en:'Refreshed', th:'รีเฟรชแล้ว' }[L] || '새로고침 완료'));
      }, 400);
    } else {
      if (_ptrEl) _ptrEl.style.transform = 'translateX(-50%) translateY(-50px)';
    }
  });
})();

// ptrSpin 애니메이션
(function() {
  var s = document.createElement('style');
  s.textContent = '@keyframes ptrSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
