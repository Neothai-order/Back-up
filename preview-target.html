<!DOCTYPE html>
<html lang="ko">
<head>

<script src="firebase-init.js?v=1"></script>
<script>
  // Firebase init (shared via firebase-init.js)
  window._fbDbTv = firebase.firestore();
  // Firebase Auth 세션 복원을 기다린 뒤 콜백 실행 (IndexedDB 에서 토큰 복구까지 수백 ms 소요)
  // 복원 후에도 user == null 이면 미로그인 상태.
  window._whenAuthReady = function(cb) {
    try {
      var auth = firebase.auth();
      if (auth.currentUser) { cb(auth.currentUser); return; }
      var unsub = auth.onAuthStateChanged(function(u) {
        try { unsub(); } catch(_) {}
        cb(u || null);
      });
    } catch(e) { cb(null); }
  };
</script>
<script src="lang.min.js?v=161"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none !important; -moz-user-select:none !important; -ms-user-select:none !important; user-select:none !important; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#f0f4f8; min-height:100vh; -webkit-user-drag:none; }
input, textarea, select, [contenteditable="true"] { -webkit-user-select:text !important; -moz-user-select:text !important; -ms-user-select:text !important; user-select:text !important; }
table, th, td, tr, div, span, p { -webkit-user-select:none !important; -moz-user-select:none !important; user-select:none !important; }
/* 헤더 바 — page-header.js의 .page-top-bar 기본 스타일 사용 */
.controls {
  display:flex; align-items:center; gap:10px; padding:14px 20px; background:#fff;
  border-bottom:1px solid #e5e7eb; flex-wrap:wrap;
}
.controls label { font-size:12px; font-weight:600; color:#6b7280; }
.controls select {
  padding:8px 12px; border:1.5px solid #d1d5db; border-radius:8px; font-size:13px; color:#374151; background:#fff;
}
.tab-group { display:flex; gap:0; }
.tab-btn {
  padding:8px 18px; border:1.5px solid #d1d5db; background:#f9fafb; color:#6b7280;
  font-size:13px; font-weight:600; cursor:pointer;
}
.tab-btn:first-child { border-radius:8px 0 0 8px; }
.tab-btn:last-child { border-radius:0 8px 8px 0; }
.tab-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
.view-toggle { display:flex; gap:4px; }
.view-btn {
  padding:6px 12px; border:1px solid #d1d5db; background:#f9fafb; color:#6b7280;
  border-radius:6px; font-size:12px; cursor:pointer;
}
.view-btn.active { background:#1e293b; color:#fff; border-color:#1e293b; }
/* 권한 안내 */
.perm-badge {
  display:inline-flex; align-items:center; gap:4px; padding:4px 10px;
  border-radius:6px; font-size:11px; font-weight:600;
}
.perm-badge.admin { background:#dbeafe; color:#1e40af; }
.perm-badge.manager { background:#fef3c7; color:#92400e; }
.perm-badge.member { background:#f3f4f6; color:#6b7280; }
/* 파일 업로드 버튼 */
.upload-btn {
  display:inline-flex; align-items:center; gap:5px; padding:6px 14px;
  border-radius:8px; border:1.5px solid #2563eb; background:#eff6ff; color:#1e40af;
  font-size:12px; font-weight:700; cursor:pointer; transition:all .15s;
  white-space:nowrap;
}
.upload-btn:hover { background:#2563eb; color:#fff; }
/* 업로드 결과 모달 */
.upload-modal-bg {
  position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.45);
  z-index:9999; display:flex; align-items:center; justify-content:center;
}
.upload-modal {
  background:#fff; border-radius:14px; padding:24px 28px; width:520px; max-width:92vw;
  max-height:80vh; overflow-y:auto; box-shadow:0 8px 30px rgba(0,0,0,.18);
}
.upload-modal h3 { font-size:16px; font-weight:700; margin-bottom:14px; color:#1e293b; display:flex; align-items:center; gap:8px; }
.upload-modal table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
.upload-modal th { background:#f1f5f9; padding:6px 8px; text-align:left; font-weight:700; color:#475569; border-bottom:2px solid #e2e8f0; }
.upload-modal td { padding:5px 8px; border-bottom:1px solid #f1f5f9; color:#334155; }
.upload-modal td.num { text-align:right; font-variant-numeric:tabular-nums; }
.upload-modal .btn-row { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.upload-modal .btn-apply {
  padding:8px 20px; border:none; border-radius:8px; background:#2563eb; color:#fff;
  font-size:13px; font-weight:700; cursor:pointer;
}
.upload-modal .btn-apply:hover { background:#1d4ed8; }
.upload-modal .btn-cancel {
  padding:8px 20px; border:1.5px solid #d1d5db; border-radius:8px; background:#fff; color:#6b7280;
  font-size:13px; font-weight:600; cursor:pointer;
}
.upload-modal .btn-cancel:hover { background:#f9fafb; }
.upload-modal .month-tag {
  display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;
  margin-right:4px;
}
.upload-modal .month-tag.found { background:#dcfce7; color:#166534; }
.upload-modal .month-tag.empty { background:#fee2e2; color:#991b1b; }
/* 요약 테이블 */
.summary-area { padding:16px 20px; display:flex; flex-direction:column; gap:16px; }
.s-table-wrap {
  background:#fff; border-radius:12px; border:1px solid #e5e7eb;
  box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden;
}
.s-table-wrap .s-title {
  padding:12px 18px 8px; font-size:13px; font-weight:700; letter-spacing:.3px;
  display:flex; align-items:center; gap:8px;
}
.s-table-wrap .s-title.sale { color:#1e40af; }
.s-table-wrap .s-title.recv { color:#065f46; }
.s-tbl { width:100%; border-collapse:collapse; table-layout:fixed; }
.s-tbl th {
  padding:6px 8px; font-size:10px; font-weight:700; color:#6b7280;
  text-transform:uppercase; letter-spacing:.5px; text-align:center;
  background:#f8fafc; border-bottom:2px solid #e5e7eb; white-space:nowrap;
}
.s-tbl th.left { text-align:left; }
.s-tbl th.sale-h { background:#eff6ff; color:#1e40af; }
.s-tbl th.recv-h { background:#f0fdf4; color:#065f46; }
.s-tbl th.recv-imp { background:#fef3c7; color:#92400e; }
.s-tbl th.recv-ct { background:#ede9fe; color:#5b21b6; }
.s-tbl th.recv-tot { background:#f0fdf4; color:#065f46; }
.s-tbl td.val-actual-imp { font-weight:800; color:#b45309; }
.s-tbl td.val-actual-ct { font-weight:800; color:#7c3aed; }
.s-tbl td {
  padding:6px 8px; font-size:13px; color:#374151; text-align:right;
  border-bottom:1px solid #f1f5f9; white-space:nowrap;
}
.s-tbl td.left { text-align:left; font-weight:600; }
.s-tbl tbody tr[onclick]:hover { background:#eff6ff !important; }
.s-tbl tbody tr[onclick]:hover td.left { color:#2563eb; }
.s-tbl td.val-plan { font-weight:700; color:#374151; }
.s-tbl td.val-actual-sale { font-weight:800; color:#2563eb; }
.s-tbl td.val-actual-recv { font-weight:800; color:#059669; }
.s-tbl tr.total-row td { background:#f8fafc; font-weight:800; border-top:2px solid #e5e7eb; }
.pct-bar-wrap { height:6px; background:#e5e7eb; border-radius:3px; margin-top:6px; overflow:hidden; }
.pct-bar { height:100%; border-radius:3px; transition:width .3s; }
/* 개인 카드 */
.person-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(480px,1fr)); gap:16px; padding:0 20px 20px; }
.p-card {
  background:#fff; border-radius:14px; border:1px solid #e5e7eb;
  box-shadow:0 2px 8px rgba(0,0,0,.06); overflow:hidden;
}
.p-card-header {
  padding:14px 18px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid #f1f5f9;
}
.p-avatar {
  width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:800; color:#fff; flex-shrink:0;
}
.p-card-header .p-name { font-size:15px; font-weight:700; color:#1e293b; }
.p-card-header .p-team { font-size:11px; color:#9ca3af; font-weight:600; }
.p-card-body { display:flex; gap:0; }
.p-half {
  flex:1; padding:14px 18px;
}
.p-half:first-child { border-right:1px solid #f1f5f9; }
.p-half-title {
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}
.p-half-title.sale { color:#1e40af; }
.p-half-title.recv { color:#065f46; }
.p-half-title .dot { width:8px; height:8px; border-radius:50%; }
.p-stat-row { display:flex; justify-content:space-between; align-items:center; padding:3px 0; }
.p-stat-row .p-stat-key { font-size:11px; color:#9ca3af; font-weight:600; }
.p-stat-row .p-stat-val { font-size:14px; font-weight:800; }
.p-pct-big { font-size:22px; font-weight:800; margin-top:6px; text-align:center; }
.pct-good { color:#059669; }
.pct-warn { color:#d97706; }
.pct-bad { color:#dc2626; }
/* 테이블 */
.table-wrap { padding:0 20px 20px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
thead th {
  background:#f8fafc; padding:10px 12px; font-size:10px; font-weight:700;
  color:#6b7280; text-transform:uppercase; letter-spacing:.5px;
  border-bottom:2px solid #e5e7eb; text-align:center; white-space:nowrap;
}
thead th.left { text-align:left; }
thead th.group-sale { background:#eff6ff; color:#1e40af; }
thead th.group-recv { background:#f0fdf4; color:#065f46; }
tbody td {
  padding:8px 12px; font-size:13px; color:#374151; border-bottom:1px solid #f1f5f9;
  text-align:right; white-space:nowrap;
}
tbody td.left { text-align:left; }
tbody td.name-cell { font-weight:700; text-align:left; }
tbody tr:hover { background:#f8fafc; }
tbody tr.team-header td { background:#f0f4f8; font-weight:700; color:#1e293b; font-size:12px; }
tbody tr.team-total td { background:#eff6ff; font-weight:700; color:#1e40af; border-top:2px solid #bfdbfe; }
/* 차트 영역 */
.chart-section { padding:0 20px 20px; }
.chart-flow {
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  grid-template-areas:
    "sale-bar recv-bar"
    "sale-pie recv-pie";
}
.cflow-sale-bar { grid-area: sale-bar; }
.cflow-sale-pie { grid-area: sale-pie; }
.cflow-recv-bar { grid-area: recv-bar; }
.cflow-recv-pie { grid-area: recv-pie; }
.chart-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.chart-box {
  background:#fff; border-radius:14px; border:1px solid #e5e7eb;
  box-shadow:0 2px 8px rgba(0,0,0,.06); padding:18px 20px; overflow:visible;
}
.chart-box .chart-title {
  font-size:13px; font-weight:700; color:#1e293b; margin-bottom:12px;
  display:flex; align-items:center; gap:8px;
}
.chart-box canvas { max-height:300px; }
#splitPieArea canvas { max-width:100%; height:200px; }
#splitPieArea > div { min-height:220px; }
.chart-box { min-width:0; }
.bar-toggle { display:flex; gap:0; }
.bar-tog-btn {
  padding:4px 12px; border:1px solid #d1d5db; background:#f9fafb; color:#6b7280;
  font-size:11px; font-weight:600; cursor:pointer; transition:all .15s;
}
.bar-tog-btn:first-child { border-radius:6px 0 0 6px; }
.bar-tog-btn:last-child { border-radius:0 6px 6px 0; border-left:0; }
.bar-tog-btn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
.chart-box[id*="Recv"] .bar-tog-btn.active { background:#059669; border-color:#059669; }
.split-tog-btn {
  padding:4px 10px; border:none; border-radius:12px; font-size:11px; font-weight:700;
  cursor:pointer; transition:all .15s; opacity:1;
}
.split-tog-btn:not(.active) { background:#e5e7eb !important; color:#9ca3af !important; opacity:0.6; }
/* 숫자 애니메이션 */
@keyframes valPop { 0%{opacity:0;transform:translateY(8px) scale(0.95)} 100%{opacity:1;transform:translateY(0) scale(1)} }
.s-tbl.anim td { animation: valPop .35s ease-out both; }
.s-tbl.anim tr:nth-child(1) td { animation-delay:.03s; }
.s-tbl.anim tr:nth-child(2) td { animation-delay:.07s; }
.s-tbl.anim tr:nth-child(3) td { animation-delay:.11s; }
.s-tbl.anim tr:nth-child(4) td { animation-delay:.15s; }
.s-tbl.anim tr:nth-child(5) td { animation-delay:.19s; }
.s-tbl.anim tr:nth-child(6) td { animation-delay:.23s; }
/* 슬라이드 전환 (구분 토글) */
@keyframes slideOutRight { 0%{opacity:1;transform:translateX(0)} 100%{opacity:0;transform:translateX(60px)} }
@keyframes slideInLeft { 0%{opacity:0;transform:translateX(-60px)} 100%{opacity:1;transform:translateX(0)} }
.slide-out-right { animation: slideOutRight .25s ease-in both; }
.slide-in-left { animation: slideInLeft .3s ease-out both; }
.summary-area, .chart-section { overflow:hidden; position:relative; }
/* 파편 애니메이션 */
.frag-piece { position:fixed; pointer-events:none; z-index:9999; background:#fff; border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,0.12); }
@keyframes fragOut { 0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)} 100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(0.3)} }
@keyframes fragIn { 0%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(0.3)} 100%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)} }
.frag-out { animation: fragOut .3s ease-in both; }
.chk-row { padding:6px 20px; border-top:0; }
.s-split-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.s-split-card { background:#f8fafc; border-radius:8px; padding:6px; overflow-x:auto; }
.s-split-card .s-tbl { width:100%; }
@media(max-width:768px) {
  .summary-cards { grid-template-columns:1fr; }
  .person-cards { grid-template-columns:1fr; min-width:0; }
  .p-card-body { flex-direction:row; }
  table { font-size:10px; }
  thead th, tbody td { padding:4px 4px; }
  .chart-flow {
    grid-template-columns:1fr !important;
    grid-template-areas:
      "sale-bar"
      "sale-pie"
      "recv-bar"
      "recv-pie" !important;
    gap:8px;
  }
  .chart-flow .chart-box canvas { max-height:280px; }
  .cflow-sale-pie canvas, .cflow-recv-pie canvas { max-height:250px !important; }
  #chartPieRecv { max-height:250px !important; }
  #splitPieArea canvas { max-height:120px !important; }
  .chart-row { grid-template-columns:1fr !important; gap:6px; }
  .s-split-grid { grid-template-columns:1fr !important; }
  .chart-box canvas { max-height:220px; }
  .chart-box .chart-title { font-size:11px; }
  .chart-box .bar-toggle .bar-tog-btn { font-size:9px; padding:3px 6px; }
  .split-tog-btn { font-size:9px !important; padding:2px 6px !important; }
  .team-detail-charts { grid-template-columns:1fr; }
  .controls { padding:8px 12px; gap:6px; }
  .controls select { padding:5px 6px; font-size:11px; }
  .controls label { font-size:11px; }
  .tab-btn { padding:6px 10px; font-size:11px; }
  .summary-area { padding:10px 8px; }
  .chart-section { padding:0 8px 12px; }
  /* 요약 테이블 모바일 최적화 */
  .s-tbl { font-size:9px; }
  .s-tbl th, .s-tbl td { padding:3px 3px; }
  .s-title { font-size:12px !important; }
  .hide-mob { display:none !important; }
}
</style>
</head>
<body oncontextmenu="event.preventDefault();">

<!-- 상단 헤더 바 (공용 page-header.js로 렌더) -->
<div id="pageTopBar"></div>
<script src="page-header.js?v=1"></script>
<script>
(function() {
  var _hdr = renderPageTopBar({
    titleHtml: '📊 <span data-i18n="tv_title">매출 수금 집계 현황</span>',
    showBack: false,
    theme: 'light'
  });
  _hdr.rightSlot.innerHTML =
    '<span class="perm-badge admin" id="permBadge" style="display:none;">👑 관리자</span>' +

      '📄 <span data-i18n="tv_pdf">PDF</span>' +
    '</button>' +
    '<button class="upload-btn hide-mob" onclick="downloadReport()" title="리포트 다운로드" style="background:#059669;border-color:#047857;">' +

    '</button>' +
    '<button class="upload-btn hide-mob" onclick="document.getElementById(\'fileUpload\').click()" title="실적 데이터 업로드">' +

</script>

<!-- 체크박스 옵션 행 -->
<div class="controls chk-row">

function _loadScript(url) {
  return new Promise(function(resolve, reject) {
    if (document.querySelector('script[src="'+url+'"]')) return resolve();
    var s = document.createElement('script'); s.src = url;
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

function downloadPDF() {
  var area = document.getElementById('summaryArea');
  var charts = document.getElementById('chartSection');
  if (!area) return alert('표시할 데이터가 없습니다.');

  var btn = event.target.closest('button');
  var origText = btn.innerHTML;
  btn.innerHTML = '⏳ ...';
  btn.disabled = true;

  Promise.all([
    _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
    _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
  ]).then(function() {
    // 테이블 + 차트를 각각 캡처 후 합침
    var parts = [area];
    if (charts && charts.style.display !== 'none') parts.push(charts);

    var promises = parts.map(function(el) {
      return html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#fff' });
    });

    return Promise.all(promises).then(function(canvases) {
      // 전체 너비/높이 계산
      var totalW = 0, totalH = 0;
      canvases.forEach(function(c) { totalW = Math.max(totalW, c.width); totalH += c.height; });

      // 합성 캔버스
      var merged = document.createElement('canvas');
      merged.width = totalW; merged.height = totalH;
      var mctx = merged.getContext('2d');
      mctx.fillStyle = '#fff';
      mctx.fillRect(0, 0, totalW, totalH);
      var yOff = 0;
      canvases.forEach(function(c) { mctx.drawImage(c, 0, yOff); yOff += c.height; });

      var imgData = merged.toDataURL('image/jpeg', 0.95);
      // 항상 한 페이지에 맞춰 출력 (가로형 A4, 콘텐츠 가로/세로 중 더 제약이 큰 쪽에 맞춰 축소)
      var isMobile = window.innerWidth <= 768;
      // 세로 방향이 아주 긴 콘텐츠는 세로 A4가 더 적합. 가로비 > 1.1 이면 landscape, 그 외는 portrait.
      var imgRatio = merged.width / merged.height;
      var orient = imgRatio >= 1.1 ? 'l' : 'p';
      var pageW = orient === 'l' ? 297 : 210;
      var pageH = orient === 'l' ? 210 : 297;
      var margin = 6;
      var contentW = pageW - margin * 2;
      var contentH = pageH - margin * 2;
      // 한 페이지에 전체를 맞춤: 가로/세로 제약 중 작은 쪽으로 스케일링
      var fitW = contentW;
      var fitH = fitW / imgRatio;
      if (fitH > contentH) {
        fitH = contentH;
        fitW = fitH * imgRatio;
      }
      var pdf = new jspdf.jsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
      var x = margin + (contentW - fitW) / 2;
      var y = margin + (contentH - fitH) / 2;
      pdf.addImage(imgData, 'JPEG', x, y, fitW, fitH);
      var period = document.getElementById('monthFilter');
      var periodText = period.options[period.selectedIndex].text || 'All';
      var year = document.getElementById('yearFilter').value || '2026';
      pdf.save('Report_' + year + '_' + periodText + '.pdf');
      btn.innerHTML = origText;
      btn.disabled = false;
    });
  }).catch(function() {
    alert('PDF 생성 실패');
    btn.innerHTML = origText;
    btn.disabled = false;
  });
}

      _push([p.name, sp, sa, sp ? sa/sp : 0, rp, ra, rp ? ra/rp : 0], numMeta);
    });
    emittedTeams[tn] = true;
  });
  // teamOrder 에 없는 팀
  Object.keys(byTeam).forEach(function(tn) {
    if (emittedTeams[tn]) return;
    if (!byTeam[tn].length) return;
    _push(['▶ ' + tn], []);
    byTeam[tn].forEach(function(p) {
      var sp = _vatAdj(p.salePlan);
      var sa = _vatAdj(p.saleActual);
      var rp = _vatAdj(p.recvPlan);
      var ra = _vatAdj(p.recvActual);
      _push([p.name, sp, sa, sp ? sa/sp : 0, rp, ra, rp ? ra/rp : 0], numMeta);
    });
  });

  // ─── 시트 생성 ──────────────────────────────
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  cellMeta.forEach(function(m) {
    var addr = XLSX.utils.encode_cell({ c: m.c, r: m.r });
    if (ws[addr]) {
      if (m.t) ws[addr].t = m.t;
      if (m.z) ws[addr].z = m.z;
    }
  });
  // 원본 템플릿과 동일한 컬럼 너비
  ws['!cols'] = [
    { wch: 40 }, // A: Team/Name
    { wch: 18 }, // B: Sales Plan
    { wch: 20 }, // C: Sales Actual
    { wch: 12 }, // D: %
    { wch: 18 }, // E: Collection Plan
    { wch: 20 }, // F: Collection Actual
    { wch: 12 }  // G: %
  ];

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');

  // ─── 파일명: Sales collection report_{month}_{year}_{ddmmyyyy}.xlsx ──
  var periodSel = document.getElementById('monthFilter');
  var periodText = (periodSel.options[periodSel.selectedIndex].text || 'All').replace(/\s+/g, '');
  var year = document.getElementById('yearFilter').value || '2026';
  var today = new Date();
  var dd = String(today.getDate()).padStart(2, '0');
  var mm = String(today.getMonth() + 1).padStart(2, '0');
  var yyyy = today.getFullYear();
  var fileName = 'Sales collection report_' + periodText + '_' + year + '_' + dd + mm + yyyy + '.xlsx';
  XLSX.writeFile(wb, fileName);
}

function handleFileUpload(evt) {
  var file = evt.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(e.target.result, {type:'array'});
      var parsed = parseWorkbook(wb, file.name);
      var extractedDate = parsed.latestDate || _extractDateFromFileName(file.name);
      if (extractedDate) {
        // 매출/수금 각각의 기준일만 갱신 — _dataDate 는 레거시 폴백이므로 덮어쓰지 않음
        if (parsed.type === 'recv') _recvDataDate = extractedDate;
        else if (parsed.type === 'sale') _salesDataDate = extractedDate;
      }
      showUploadModal(parsed, file.name);
    } catch(err) {
      alert('파일 읽기 오류: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}

// XLSX 워크북에서 특정 시트가 숨겨져 있는지 판별
// Hidden: 0=visible, 1=hidden, 2=very hidden — 0이 아니면 모두 스킵
function _isSheetHidden(wb, sheetName) {
  try {
    if (!wb || !wb.Workbook || !Array.isArray(wb.Workbook.Sheets)) return false;
    var idx = wb.SheetNames.indexOf(sheetName);
    if (idx < 0) return false;
    var info = wb.Workbook.Sheets[idx];
    if (!info) return false;
    var h = info.Hidden;
    return (h === 1 || h === 2);
  } catch(e) { return false; }
}

function detectFileType(wb) {
  // 수금 보고서: C열=영업담당자, G열=임플란트수금, H열=CT수금
  // 매출 보고서: G열=Type(1-6), I열=금액, L열=영업사원
  var validSheets = wb.SheetNames.filter(function(n) {
    if (_isSheetHidden(wb, n)) return false;  // 숨긴 시트 제외
    var u = n.trim().toUpperCase();
    return u.indexOf('AI') < 0 && u !== 'SUMMARY' && u !== 'CUSTOMER CODE'
      && u !== 'ACHEIVEMENT' && u !== 'CALENDAR';
  });
  // 첫 유효 시트의 데이터로 판별
  for (var si = 0; si < validSheets.length; si++) {
    var upper = validSheets[si].trim().toUpperCase();
    var mi = null;
    Object.keys(MONTH_SHEETS).forEach(function(k){ if (upper === k) mi = MONTH_SHEETS[k]; });
    if (mi === null) continue;
    var ws = wb.Sheets[validSheets[si]];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.length < 8) continue;
      // 수금 보고서: C열에 이름, G/H에 숫자
      var cVal = String(row[2] || '').trim().toUpperCase();
      var gVal = row[6], hVal = row[7];
      if (NAME_MAP[cVal] && (typeof gVal === 'number' || typeof hVal === 'number')) {
        return 'recv';
      }
      // 매출 보고서: L열에 이름, G열에 타입(1-6)
      var lVal = String(row[11] || '').trim().toUpperCase();
      var typeNum = parseInt(row[6]);
      if (NAME_MAP[lVal] && typeNum >= 1 && typeNum <= 6) {
        return 'sale';
      }
    }
  }
  return 'sale'; // 기본값
}

function parseWorkbook(wb, fileName) {
  var fileType = detectFileType(wb);
  if (fileType === 'recv') return parseRecvWorkbook(wb, fileName);
  return parseSaleWorkbook(wb, fileName);
}

function parseSaleWorkbook(wb, fileName) {
  var result = {};
  var foundMonths = [];
  var maxSerial = 0;

  wb.SheetNames.forEach(function(sheetName) {
    if (_isSheetHidden(wb, sheetName)) return;  // 숨긴 시트 제외
    var upper = sheetName.trim().toUpperCase();
    if (upper.indexOf('AI') >= 0 || upper === 'SUMMARY') return;
    var mi = null;
    Object.keys(MONTH_SHEETS).forEach(function(k) { if (upper === k) mi = MONTH_SHEETS[k]; });
    if (mi === null) return;
    if (foundMonths.indexOf(mi) < 0) foundMonths.push(mi);

    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.length < 12) continue;
      var typeVal = row[6];
      var amount = parseFloat(row[8]) || 0;
      var rep = String(row[11] || '').trim().toUpperCase();
      // D열(Copies/Return) 무시 — I열에 이미 반품은 마이너스로 포함됨

      if (!rep || !typeVal) continue;
      var typeNum = parseInt(typeVal);
      if (isNaN(typeNum) || typeNum < 1 || typeNum > 6) continue;

      var mappedName = NAME_MAP[rep] || null;
      if (!mappedName) continue;

      // 유효 데이터 행의 날짜(A열) 최대값 추적
      if (typeof row[0] === 'number' && row[0] > maxSerial) maxSerial = row[0];

      if (!result[mappedName]) {
        result[mappedName] = { imp: new Array(12).fill(0), ct: new Array(12).fill(0) };
      }
      if (typeNum === 4) { result[mappedName].ct[mi] += amount; }
      else { result[mappedName].imp[mi] += amount; }
    }
  });
  foundMonths.sort(function(a,b){return a-b;});
  return { data: result, months: foundMonths, fileName: fileName, type: 'sale', latestDate: _excelSerialToYMD(maxSerial) };
}

function parseRecvWorkbook(wb, fileName) {
  var result = {};
  var foundMonths = [];
  var maxSerial = 0;
  var SKIP = ['AI','SUMMARY','CUSTOMER CODE','ACHEIVEMENT','CALENDAR'];

  wb.SheetNames.forEach(function(sheetName) {
    if (_isSheetHidden(wb, sheetName)) return;  // 숨긴 시트 제외
    var upper = sheetName.trim().toUpperCase();
    // AI 시트 무시 + 개인별 시트 무시 (이름만 있는 시트)
    for (var s = 0; s < SKIP.length; s++) { if (upper.indexOf(SKIP[s]) >= 0) return; }
    // 영업사원 이름인 시트 무시
    if (NAME_MAP[upper]) return;

    var mi = null;
    Object.keys(MONTH_SHEETS).forEach(function(k) { if (upper === k) mi = MONTH_SHEETS[k]; });
    if (mi === null) return;
    if (foundMonths.indexOf(mi) < 0) foundMonths.push(mi);

    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (!row || row.length < 8) continue;
      var rep = String(row[2] || '').trim().toUpperCase(); // C열
      var impAmt = parseFloat(row[6]) || 0; // G열: 임플란트 수금
      var ctAmt = parseFloat(row[7]) || 0;  // H열: CT 수금

      if (!rep) continue;
      var mappedName = NAME_MAP[rep] || null;
      if (!mappedName) continue;
      if (impAmt === 0 && ctAmt === 0) continue;

      // 유효 데이터 행의 날짜(A열) 최대값 추적 — 수금 보고서 포맷에 따라 없을 수 있음
      if (typeof row[0] === 'number' && row[0] > maxSerial) maxSerial = row[0];

      if (!result[mappedName]) {
        result[mappedName] = { imp: new Array(12).fill(0), ct: new Array(12).fill(0) };
      }
      // 수금 보고서 금액은 부가세 포함 → ÷1.07로 부가세 제외
      result[mappedName].imp[mi] += impAmt / 1.07;
      result[mappedName].ct[mi] += ctAmt / 1.07;
    }
  });
  foundMonths.sort(function(a,b){return a-b;});
  return { data: result, months: foundMonths, fileName: fileName, type: 'recv', latestDate: _excelSerialToYMD(maxSerial) };
}

  document.getElementById('btnApplyUpload').addEventListener('click', function() {
    applyUploadData(parsed);
    bg.remove();
  });
}

// 변경 감지 프리뷰: 파싱된 데이터 vs 현재 메모리 값 비교
// 반환: { rows: [{name, mi, oldImp, newImp, oldCt, newCt, status}], changed, added, unchanged }
// status: 'changed' | 'added' | 'unchanged' (셀 단위가 아닌 (rep,month) 단위)
function _diffUploadData(parsed) {
  var rows = [];
  var nChanged = 0, nAdded = 0, nUnchanged = 0;
  var targetList = parsed.type === 'sale' ? SALES_DATA : RECV_DATA;
  var nameIdx = {};
  targetList.forEach(function(x){ nameIdx[x.name] = x; });

  Object.keys(parsed.data).sort().forEach(function(name) {
    var rec = nameIdx[name];
    var d = parsed.data[name];
    parsed.months.forEach(function(mi) {
      var newImp = Math.round(d.imp[mi] || 0);
      var newCt  = Math.round(d.ct[mi]  || 0);
      var oldImp = 0, oldCt = 0;
      if (rec) {
        oldImp = Math.round((rec.actualImp && rec.actualImp[mi]) || 0);
        oldCt  = Math.round((rec.actualCt  && rec.actualCt[mi])  || 0);
      }
      var diffImp = newImp !== oldImp;
      var diffCt  = newCt  !== oldCt;
      var status;
      if (!diffImp && !diffCt) { status = 'unchanged'; nUnchanged++; }
      else if (oldImp === 0 && oldCt === 0) { status = 'added'; nAdded++; }
      else { status = 'changed'; nChanged++; }
      rows.push({ name:name, mi:mi, oldImp:oldImp, newImp:newImp, oldCt:oldCt, newCt:newCt, status:status, knownRep: !!rec });
    });
  });
  return { rows: rows, nChanged: nChanged, nAdded: nAdded, nUnchanged: nUnchanged };
}

function applyUploadData(parsed) {
  var data = parsed.data;
  var months = parsed.months;
  var typeLabel = '';
  var diff = _diffUploadData(parsed);
  var applyCount = 0;

  if (parsed.type === 'sale') {
    typeLabel = t('tv_sale_label');
    SALES_DATA.forEach(function(s) {
      var d = data[s.name];
      if (!d) return;
      months.forEach(function(mi) {
        var imp = Math.round(d.imp[mi] || 0);
        var ct  = Math.round(d.ct[mi]  || 0);
        var oldImp = Math.round((s.actualImp && s.actualImp[mi]) || 0);
        var oldCt  = Math.round((s.actualCt  && s.actualCt[mi])  || 0);
        // 변경 없음 → 스킵
        if (imp === oldImp && ct === oldCt) return;
        s.actual[mi] = imp + ct;
        if (s.actualImp) s.actualImp[mi] = imp;
        if (s.actualCt)  s.actualCt[mi]  = ct;
        if (ACTUAL_MAP[s.name])     { while(ACTUAL_MAP[s.name].length     <= mi) ACTUAL_MAP[s.name].push(0);     ACTUAL_MAP[s.name][mi]     = imp + ct; }
        if (ACTUAL_IMP_MAP[s.name]) { while(ACTUAL_IMP_MAP[s.name].length <= mi) ACTUAL_IMP_MAP[s.name].push(0); ACTUAL_IMP_MAP[s.name][mi] = imp; }
        if (ACTUAL_CT_MAP[s.name])  { while(ACTUAL_CT_MAP[s.name].length  <= mi) ACTUAL_CT_MAP[s.name].push(0);  ACTUAL_CT_MAP[s.name][mi]  = ct; }
        applyCount++;
      });
    });
  } else {
    typeLabel = t('tv_recv_label');
    RECV_DATA.forEach(function(r) {
      var d = data[r.name];
      if (!d) return;
      months.forEach(function(mi) {
        var imp = Math.round(d.imp[mi] || 0);
        var ct  = Math.round(d.ct[mi]  || 0);
        var oldImp = Math.round((r.actualImp && r.actualImp[mi]) || 0);
        var oldCt  = Math.round((r.actualCt  && r.actualCt[mi])  || 0);
        if (imp === oldImp && ct === oldCt) return;
        r.actual[mi] = imp + ct;
        if (r.actualImp) r.actualImp[mi] = imp;
        if (r.actualCt)  r.actualCt[mi]  = ct;
        if (RECV_ACTUAL_IMP[r.name]) RECV_ACTUAL_IMP[r.name][mi] = imp;
        if (RECV_ACTUAL_CT[r.name])  RECV_ACTUAL_CT[r.name][mi]  = ct;
        applyCount++;
      });
    });
  }

  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;z-index:10000;box-shadow:0 4px 16px rgba(0,0,0,.2);';

  if (applyCount === 0) {
    // 아무것도 바뀐 게 없음 → render/persist 스킵
    toast.style.background = '#64748b';
    toast.textContent = 'ℹ️ ' + typeLabel + ' · 변경된 데이터가 없어 건너뛰었습니다 (' + diff.nUnchanged + '건 동일)';
  } else {
    render();
    _persistDashboardToFirestore(parsed.type, months);
    toast.style.background = '#059669';
    toast.textContent = '✅ ' + typeLabel + ' · 변경 ' + diff.nChanged + '건 · 신규 ' + diff.nAdded + '건 적용 (' + diff.nUnchanged + '건 동일 스킵)';
  }
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); }, 3500);
}

// ── Firestore 저장 / 로드 ────────────────────────────────────────────────
// 문서: salesDashboard/latest { sales: {name:{imp[12],ct[12]}}, recv: {...}, dataDate, updatedAt }
function _snapshotActualMaps() {
  var salesOut = {}, recvOut = {};
  SALES_DATA.forEach(function(s) {
    salesOut[s.name] = {
      imp: (s.actualImp || new Array(12).fill(0)).slice(),
      ct:  (s.actualCt  || new Array(12).fill(0)).slice()
    };
  });
  RECV_DATA.forEach(function(r) {
    recvOut[r.name] = {
      imp: (r.actualImp || new Array(12).fill(0)).slice(),
      ct:  (r.actualCt  || new Array(12).fill(0)).slice()
    };
  });
  return { sales: salesOut, recv: recvOut };
}
function _persistDashboardToFirestore(type, months) {
  try {
    if (!window._fbDbTv) return;
    var snap = _snapshotActualMaps();

function _applyLoadedDashboard(payload) {
  if (!payload) return false;
  var salesMap = payload.sales || {};
  var recvMap  = payload.recv || {};
  var touched = false;
  SALES_DATA.forEach(function(s) {
    var d = salesMap[s.name];
    if (!d) return;
    for (var mi = 0; mi < 12; mi++) {
      var imp = (d.imp && typeof d.imp[mi] === 'number') ? d.imp[mi] : 0;
      var ct  = (d.ct  && typeof d.ct[mi]  === 'number') ? d.ct[mi]  : 0;
      if (imp === 0 && ct === 0) continue;
      s.actual[mi] = imp + ct;
      if (s.actualImp) s.actualImp[mi] = imp;
      if (s.actualCt)  s.actualCt[mi]  = ct;
      if (ACTUAL_MAP[s.name])     { while(ACTUAL_MAP[s.name].length     <= mi) ACTUAL_MAP[s.name].push(0);     ACTUAL_MAP[s.name][mi]     = imp + ct; }
      if (ACTUAL_IMP_MAP[s.name]) { while(ACTUAL_IMP_MAP[s.name].length <= mi) ACTUAL_IMP_MAP[s.name].push(0); ACTUAL_IMP_MAP[s.name][mi] = imp; }
      if (ACTUAL_CT_MAP[s.name])  { while(ACTUAL_CT_MAP[s.name].length  <= mi) ACTUAL_CT_MAP[s.name].push(0);  ACTUAL_CT_MAP[s.name][mi]  = ct; }
      touched = true;
    }
  });
  RECV_DATA.forEach(function(r) {
    var d = recvMap[r.name];
    if (!d) return;
    for (var mi = 0; mi < 12; mi++) {
      var imp = (d.imp && typeof d.imp[mi] === 'number') ? d.imp[mi] : 0;
      var ct  = (d.ct  && typeof d.ct[mi]  === 'number') ? d.ct[mi]  : 0;
      if (imp === 0 && ct === 0) continue;
      r.actual[mi] = imp + ct;
      if (r.actualImp) r.actualImp[mi] = imp;
      if (r.actualCt)  r.actualCt[mi]  = ct;
      if (RECV_ACTUAL_IMP[r.name]) RECV_ACTUAL_IMP[r.name][mi] = imp;
      if (RECV_ACTUAL_CT[r.name])  RECV_ACTUAL_CT[r.name][mi]  = ct;
      touched = true;
    }
  });
  if (payload.dataDate) _dataDate = payload.dataDate;
  if (payload.salesDataDate) _salesDataDate = payload.salesDataDate;
  if (payload.recvDataDate)  _recvDataDate  = payload.recvDataDate;
  // 레거시 페이로드 호환: split 필드가 아예 없으면 dataDate 를 양쪽 초기값으로 사용.
  // 이후 신규 업로드가 있으면 해당 타입만 갱신되어 독립성을 유지.
  if (payload.dataDate && !payload.salesDataDate && !payload.recvDataDate) {
    if (!_salesDataDate) _salesDataDate = payload.dataDate;
    if (!_recvDataDate)  _recvDataDate  = payload.dataDate;
  }
  return touched;
}
function _loadDashboardFromStorage() {
  // 1) localStorage 즉시 반영 (오프라인/부팅 지연 대비)
  try {
    var raw = localStorage.getItem('salesDashboard_latest');
    if (raw) {

  // 2) Firestore 최신본으로 덮어쓰기 — auth 세션 복원을 기다린 뒤 읽기
  //    (currentUser == null 상태에서 get() 하면 permission-denied 로 실패)
  if (!window._fbDbTv) return;
  var runRead = function(user) {
    if (!user) {
      console.log('[salesDashboard] 미로그인 — Firestore 로드 스킵, localStorage 값 유지');

          render();
        }
      })
      .catch(function(e){ console.warn('[salesDashboard] load 실패:', e); });
  };
  if (typeof window._whenAuthReady === 'function') window._whenAuthReady(runRead);
  else runRead(null);
}

function _extractDateFromFileName(name) {
  // 20260409 패턴
  var m = name.match(/(\d{4})(\d{2})(\d{2})/);
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  // 2026-04-09 또는 2026.04.09 패턴
  m = name.match(/(\d{4})[-.](\d{2})[-.](\d{2})/);
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
// Excel 날짜 일련번호 → YYYY-MM-DD (UTC 기준, 1900 leap-year 버그 포함 기준일 1899-12-30)
function _excelSerialToYMD(serial) {
  if (typeof serial !== 'number' || !isFinite(serial) || serial <= 0) return null;
  var ms = Date.UTC(1899, 11, 30) + serial * 86400000;
  var d = new Date(ms);
  var y = d.getUTCFullYear();
  if (y < 1970 || y > 2100) return null;
  var mm = String(d.getUTCMonth()+1).padStart(2, '0');
  var dd = String(d.getUTCDate()).padStart(2, '0');
  return y + '-' + mm + '-' + dd;
}
function _getDataPeriodLabel(periodIndices, type) {
  var year = document.getElementById('yearFilter').value || '2026';
  // type 별 기준일 선택 — 각 타입은 자기 자신의 기준일만 사용(폴백 없음).
  //   'sale' → _salesDataDate 없으면 ''
  //   'recv' → _recvDataDate  없으면 ''
  //   (type 미지정) → _dataDate (레거시 단일 라벨)
  var src = '';
  if (type === 'sale')      src = _salesDataDate || '';
  else if (type === 'recv') src = _recvDataDate  || '';
  else                      src = _dataDate      || '';
  if (!src) return '';
  var dd = new Date(src);
  if (isNaN(dd.getTime())) return '';
  var dataM = dd.getMonth(); // 0-based
  var dataD = dd.getDate();
  // 선택된 기간의 월 범위
  var minM = Math.min.apply(null, periodIndices);
  var maxM = Math.max.apply(null, periodIndices);
  var startM = minM + 1; // 1-based
  var endM = maxM + 1;
  // 데이터 기준일이 선택 기간 내에 있으면 해당일까지, 아니면 월말까지
  if (dataM >= minM && dataM <= maxM) {
    return startM+'/1 ~ '+( dataM+1)+'/'+dataD;
  } else if (dataM > maxM) {
    // 데이터가 더 최신 → 해당 기간 전체
    var lastDay = new Date(parseInt(year), maxM+1, 0).getDate();
    return startM+'/1 ~ '+endM+'/'+lastDay;
  } else {
    return startM+'/1 ~ '+startM+'/1';
  }
}

function _fragTransition(cb) {
  var sa = document.getElementById('summaryArea');
  var cs = document.getElementById('chartSection');
  var targets = [sa, cs];
  var frags = [];

  targets.forEach(function(el) {
    var rect = el.getBoundingClientRect();
    if (rect.height <= 0 || rect.width <= 0) return;
    var cols = 5, rows = 3;
    var fw = rect.width / cols, fh = rect.height / rows;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var f = document.createElement('div');
        f.className = 'frag-piece frag-out';
        var fx = (Math.random() - 0.5) * 300;
        var fy = (Math.random() - 0.5) * 250;
        var fr = (Math.random() - 0.5) * 90;
        f.style.cssText = 'left:'+(rect.left+c*fw)+'px;top:'+(rect.top+r*fh)+'px;width:'+fw+'px;height:'+fh+'px;--fx:'+fx+'px;--fy:'+fy+'px;--fr:'+fr+'deg;animation-delay:'+(r*0.03+c*0.02)+'s;';
        document.body.appendChild(f);
        frags.push(f);
      }
    }
    el.style.opacity = '0';
  });

  setTimeout(function() {
    frags.forEach(function(f){ f.remove(); });
    cb();
    targets.forEach(function(el) { el.style.opacity = '1'; });
  }, 300);
}

// 배열 합산 헬퍼 (indices=null이면 전체 합)
function _sumArr(arr, indices) {
  if (!indices) return arr.reduce(function(a,b){return a+b;},0);
  return indices.reduce(function(s,i){return s+arr[i];},0);
}
// 수금 배열 합산 (months[i].field)
function _sumRecv(months, indices, field) {
  if (!indices) return months.reduce(function(s,m){return s+m[field];},0);

}

// ── 팝업 연동용 총계 저장 (salesDashboard/latest.popupTotals) ────────────────
var _lastPopupTotals = null;

var _popupTotalsTimer = null;
function _schedulePersistPopupTotals() {
  if (_popupTotalsTimer) clearTimeout(_popupTotalsTimer);
  _popupTotalsTimer = setTimeout(_persistPopupTotals, 1200);
}
function _persistPopupTotals() {
  try {
    if (!window._fbDbTv) return;
    var now = new Date();
    var monthIx = [now.getMonth()]; // 현재 월 (0-based) 만
    var sp=0, sa=0, rp=0, ra=0;
    var perPerson = {}, perTeam = {}, personTeamMap = {};
    function _pp(name) {
      if (!perPerson[name]) perPerson[name] = {sp:0,sa:0,rp:0,ra:0};
      return perPerson[name];
    }
    function _pt(team) {
      if (!perTeam[team]) perTeam[team] = {sp:0,sa:0,rp:0,ra:0};
      return perTeam[team];
    }
    (SALES_DATA || []).forEach(function(s){
      var vsp = _vatAdj(_sumArr(s.months, monthIx));
      var vsa = _vatAdj(_sumArr(s.actual, monthIx));
      sp += vsp; sa += vsa;
      var p = _pp(s.name); p.sp += vsp; p.sa += vsa;
      var t = _pt(s.team); t.sp += vsp; t.sa += vsa;
      personTeamMap[s.name] = s.team;
    });
    (RECV_DATA || []).forEach(function(r){
      var vrp = _vatAdj(_sumRecv(r.months, monthIx, 't'));
      var vra = _vatAdj(_sumArr(r.actual, monthIx));
      rp += vrp; ra += vra;
      var p = _pp(r.name); p.rp += vrp; p.ra += vra;
      var t = _pt(r.team); t.rp += vrp; t.ra += vra;
      if (!personTeamMap[r.name]) personTeamMap[r.name] = r.team;
    });
    var totals = { sp:sp, sa:sa, rp:rp, ra:ra };
    var last = _lastPopupTotals;
    // 전체 + per-person + per-team 해시로 변경 감지
    var sig = JSON.stringify({t:totals, p:perPerson, g:perTeam, m:personTeamMap});
    if (_lastPopupTotalsSig === sig) return;
    _lastPopupTotalsSig = sig;
    _lastPopupTotals = totals;
    var user = null;
    try { user = firebase.auth().currentUser; } catch(_){}
    if (!user) return; // 미로그인 시 스킵
    window._fbDbTv.collection('salesDashboard').doc('latest').set({
      popupTotals: totals,
      popupTotalsPerPerson: perPerson,
      popupTotalsPerTeam: perTeam,
      popupPersonTeamMap: personTeamMap,
      popupTotalsMonth: now.getMonth() + 1,
      popupTotalsUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(function(){
      console.log('[popupTotals] 저장 완료', totals, '/ persons:', Object.keys(perPerson).length, '/ teams:', Object.keys(perTeam).length);
    }).catch(function(e){ console.warn('[popupTotals] 저장 실패:', e); });
  } catch(e) { console.warn('[popupTotals] 예외:', e); }
}

function _alignTableToCharts() {
  // 2분할 그리드 모드에서는 정렬 불필요
  if (document.querySelector('.s-split-grid')) return;
  var tbl = document.querySelector('.s-tbl');
  if (!tbl) return;
  var saleBox = document.getElementById('chartBoxBarSale');
  var recvBox = document.getElementById('chartBoxBarRecv');
  var tableWrap = document.querySelector('.s-table-wrap');
  if (!tableWrap) return;

  var tR = tableWrap.getBoundingClientRect();
  var tW = tR.width;
  if (tW <= 0) return;

  var showSale = saleBox && saleBox.style.display !== 'none';
  var showRecv = recvBox && recvBox.style.display !== 'none';

  // 기존 colgroup 제거
  var existing = tbl.querySelector('colgroup');
  if (existing) existing.remove();
  var cg = document.createElement('colgroup');

  if (showSale && showRecv) {
    // 양쪽 다 표시: 7열 (이름 | 매출계획 | 매출실적 | % | 수금계획 | 수금실적 | %)
    var sR = saleBox.getBoundingClientRect();
    var rR = recvBox.getBoundingClientRect();
    var saleEndPct = (sR.right - tR.left) / tW * 100;
    var recvStartPct = (rR.left - tR.left) / tW * 100;
    var gapPct = recvStartPct - saleEndPct;
    var recvContentPct = 100 - recvStartPct;

    var namePct = Math.min(12, saleEndPct * 0.22);
    var saleTotalPct = saleEndPct - namePct;

    // 매출 열: 계획 38%, 실적 38%, % 24%
    var sPlanPct = saleTotalPct * 0.38;
    var sActualPct = saleTotalPct * 0.38;
    var sPctPct = saleTotalPct * 0.24;

    // 수금 열: 갭을 첫 수금 열에 흡수
    var rPlanPct = recvContentPct * 0.38 + gapPct;

    var cols = tbl.querySelectorAll('thead tr:last-child th');
    var numCols = cols.length;
    if (numCols >= 9) {
      // 2행 헤더: 이름(rowspan) + 9 data cols
      var nameW = 10;
      var grpW = (100 - nameW) / 3; // 각 그룹 (임플란트/CT/합계)
      cg.innerHTML = '<col style="width:'+nameW+'%">';
      for (var i=0;i<3;i++) {
        cg.innerHTML += '<col style="width:'+(grpW*0.38)+'%"><col style="width:'+(grpW*0.38)+'%"><col style="width:'+(grpW*0.24)+'%">';
      }
    } else {
      cg.innerHTML = '<col style="width:15%"><col style="width:30%"><col style="width:35%"><col style="width:20%">';
    }
  } else {

    cg.innerHTML = '<col style="width:15%"><col style="width:30%"><col style="width:35%"><col style="width:20%">';
  }

  tbl.insertBefore(cg, tbl.firstChild);
}

function renderSummary(d) {
  var ix = d.monthIndices;
  var period = d.periodLabel;
  var html = '';

  // 팀별 매출/수금 집계
  var teamSales = {}, teamRecv = {};
  d.sales.forEach(function(s) {
    if (!teamSales[s.team]) teamSales[s.team] = { plan:0, actual:0 };
    teamSales[s.team].plan += _sumArr(s.months, ix);
    teamSales[s.team].actual += _sumArr(s.actual, ix);
  });
  d.recv.forEach(function(r) {
    if (!teamRecv[r.team]) teamRecv[r.team] = { plan:0, actual:0, planP:0, planM:0, actImp:0, actCt:0 };
    teamRecv[r.team].plan += _sumRecv(r.months, ix, 't');
    teamRecv[r.team].planP += _sumRecv(r.months, ix, 'p');
    teamRecv[r.team].planM += _sumRecv(r.months, ix, 'm');
    teamRecv[r.team].actual += _sumArr(r.actual, ix);
    teamRecv[r.team].actImp += r.actualImp ? _sumArr(r.actualImp, ix) : 0;
    teamRecv[r.team].actCt += r.actualCt ? _sumArr(r.actualCt, ix) : 0;
  });

  var teamOrder = ['BKK','North East','East','North','South'];
  var showSale = _curTab !== 'receive';
  var showRecv = _curTab !== 'sales';
  var splitRecv = document.getElementById('chkSplitRecv').checked && showRecv && !showSale;
  var selTeam = document.getElementById('teamFilter').value;
  var selPerson = document.getElementById('personFilter').value;

  // 수금 분리 행 렌더 헬퍼 (실제 imp/ct 실적 직접 전달)
  function recvBreakdownCells(planP, planM, planT, actual, actImp, actCt) {
    // actImp/actCt가 전달되면 실제 값 사용, 아니면 비율 분배
    var impA, ctA;
    if (typeof actImp === 'number' && typeof actCt === 'number') {
      impA = actImp; ctA = actCt;
    } else {
      if (planP + planM <= 0) { impA = 0; ctA = 0; }
      else { impA = Math.round(actual * planP / (planP + planM)); ctA = actual - impA; }
    }
    var impPct = planP ? Math.round(impA / planP * 100) : 0;
    var ctPct = planM ? Math.round(ctA / planM * 100) : 0;
    var totPct = planT ? Math.round(actual / planT * 100) : 0;
    var _f = _isMob ? fmtK : fmt;
    var h = '';
    h += '<td class="val-plan">฿'+_f(_vatAdj(planP))+'</td><td class="val-actual-imp">฿'+_f(_vatAdj(impA))+'</td><td class="'+pctClass(impPct)+'" style="font-weight:800;">'+impPct+'%</td>';
    h += '<td class="val-plan">฿'+_f(_vatAdj(planM))+'</td><td class="val-actual-ct">฿'+_f(_vatAdj(ctA))+'</td><td class="'+pctClass(ctPct)+'" style="font-weight:800;">'+ctPct+'%</td>';
    h += '<td class="val-plan">฿'+_f(_vatAdj(planT))+'</td><td class="val-actual-recv">฿'+_f(_vatAdj(actual))+'</td><td class="'+pctClass(totPct)+'" style="font-weight:800;">'+totPct+'%</td>';
    return h;
  }

  var vatLabel = document.getElementById('chkVat').checked ? t('tv_vat_on') : t('tv_vat_off');
  // 매출·수금 기준일 각각 독립 표기. 한쪽만 있으면 그쪽만, 둘 다 없으면 레거시 단일 라벨.
  var salesPeriod = _getDataPeriodLabel(ix, 'sale');
  var recvPeriod  = _getDataPeriodLabel(ix, 'recv');
  var periodHtml = '';

var _vatAnimPending = false;
function _animateNum(el, from, to, duration) {
  var start = performance.now();
  var diff = to - from;
  function tick(now) {
    var t = Math.min((now - start) / duration, 1);
    t = 1 - Math.pow(1 - t, 3); // easeOutCubic
    var cur = Math.round(from + diff * t);
    el.textContent = '฿' + fmt(cur);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

var _chartBarSale = null, _chartPieSale = null;
var _chartBarRecv = null, _chartPieRecv = null;
var _chartPieRecvImp = null, _chartPieRecvCt = null, _chartPieRecvTot = null;

function _lighten(hex, amt) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + Math.round((255-r)*amt));
  g = Math.min(255, g + Math.round((255-g)*amt));
  b = Math.min(255, b + Math.round((255-b)*amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function _makeBarChart(canvasId, teams, planData, actualData, teamColors, yMax) {
  var planColors = teamColors.map(function(c){ return _lighten(c, 0.55); });
  return new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{ labels:teams, datasets:[
      { label:t('tv_plan'), data:planData, backgroundColor:planColors, borderColor:planColors, borderWidth:0, borderRadius:4, categoryPercentage:0.6, barPercentage:0.8 },
      { label:t('tv_actual'), data:actualData, backgroundColor:teamColors, borderColor:teamColors, borderWidth:0, borderRadius:4, categoryPercentage:0.6, barPercentage:0.8 }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:45 } },
      animation: _vatAnimPending ? { y:{ from: function(ctx){ return ctx.chart.chartArea ? ctx.chart.chartArea.bottom : 0; }, duration:500, easing:'easeOutCubic' }, opacity:{ from:0, duration:400 } } : { duration:300 },
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ beginAtZero:true, max:yMax||undefined, ticks:{ callback:function(v){ return '฿'+fmt(v); }, font:{size:10} }, grid:{ color:'#f1f5f9' } },
        x:{ ticks:{ font:{size:11} }, grid:{ display:false } }
      }
    },
    plugins:[{
      id:'barLabels',
      afterDraw:function(chart) {
        var ctx = chart.ctx;
        var planDs = chart.data.datasets[0];
        var actualDs = chart.data.datasets[1];
        var planMeta = chart.getDatasetMeta(0);
        var actualMeta = chart.getDatasetMeta(1);

        planMeta.data.forEach(function(planBar, i) {
          var pv = planDs.data[i];
          var av = actualDs.data[i];
          if(!pv && !av) return;
          var actualBar = actualMeta.data[i];
          var pct = pv ? Math.round(av/pv*100) : 0;

          var planY = planBar.y;
          var actualY = actualBar.y;
          var gap = Math.abs(planY - actualY);
          var overlap = gap < 18;

          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = '10px system-ui';
          ctx.fillStyle = '#6b7280';
          if(pv) ctx.fillText('฿'+fmt(pv), planBar.x, planY - 6);

          var actualText = '฿'+fmt(av)+' ('+pct+'%)';
          if (overlap) {
            var topY = Math.min(planY, actualY);
            var labelY = topY - 32;
            ctx.beginPath();
            ctx.moveTo(actualBar.x, actualY - 2);
            ctx.lineTo(actualBar.x, labelY + 4);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.font = 'bold 11px system-ui';
            ctx.fillStyle = '#1e293b';
            ctx.fillText(actualText, actualBar.x, labelY);
          } else {
            ctx.textAlign = 'center';
            ctx.font = 'bold 11px system-ui';
            ctx.fillStyle = '#1e293b';
            ctx.fillText(actualText, actualBar.x, actualY - 6);
          }
          ctx.restore();
        });
      }
    }]
  });
}

  // 임플란트

    datasets.push({ label:t('tv_imp_plan'), data:impPlans, backgroundColor:'rgba(134,239,172,0.45)', borderWidth:1, borderColor:'#86efac', borderRadius:3, stack:'imp', order:2, barPercentage:bpct, categoryPercentage:cpct, _group:'imp' });
    datasets.push({ label:t('tv_imp_actual'), data:impActuals, backgroundColor:'#059669', borderWidth:0, borderRadius:3, stack:'imp', order:1, barPercentage:bpct, categoryPercentage:cpct, _group:'imp' });
  }
  // CT
  if (_splitShow.ct) {
    datasets.push({ label:t('tv_ct_plan'), data:ctPlans, backgroundColor:'rgba(196,181,253,0.45)', borderWidth:1, borderColor:'#c4b5fd', borderRadius:3, stack:'ct', order:2, barPercentage:bpct, categoryPercentage:cpct, _group:'ct' });
    datasets.push({ label:t('tv_ct_actual'), data:ctActuals, backgroundColor:'#7c3aed', borderWidth:0, borderRadius:3, stack:'ct', order:1, barPercentage:bpct, categoryPercentage:cpct, _group:'ct' });
  }
  // 합계
  if (_splitShow.total) {
    datasets.push({ label:t('tv_total_plan'), data:totPlans, backgroundColor:'rgba(147,197,253,0.45)', borderWidth:1, borderColor:'#93c5fd', borderRadius:3, stack:'tot', order:2, barPercentage:bpct, categoryPercentage:cpct, _group:'tot' });
    datasets.push({ label:t('tv_total_actual'), data:totActuals, backgroundColor:'#2563eb', borderWidth:0, borderRadius:3, stack:'tot', order:1, barPercentage:bpct, categoryPercentage:cpct, _group:'tot' });
  }
  if (datasets.length === 0) {
    datasets.push({ label:'-', data:zeroArr, backgroundColor:'transparent', stack:'x' });
  }

  return new Chart(document.getElementById(canvasId), {
    type:'bar',
    data:{ labels:labels, datasets:datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:65 } },
      animation: _vatAnimPending ? { y:{ from: function(ctx){ return ctx.chart.chartArea ? ctx.chart.chartArea.bottom : 0; }, duration:500, easing:'easeOutCubic' }, opacity:{ from:0, duration:400 } } : { duration:300 },
      plugins:{
        legend:{ display:false }
      },
      scales:{
        x:{ stacked:true, ticks:{ font:{size:11} }, grid:{ display:false } },
        y:{ stacked:false, beginAtZero:true, max:yMax||undefined, ticks:{ callback:function(v){ return '฿'+fmt(v); }, font:{size:10} }, grid:{ color:'#f1f5f9' } }
      }
    },
    plugins:[{
      id:'splitOverlayLabels',
      afterDraw:function(chart) {
        var ctx = chart.ctx;
        var ds = chart.data.datasets;
        var n = chart.data.labels.length;
        var colorMap = { imp:'#059669', ct:'#7c3aed', tot:'#2563eb' };
        // 동적으로 plan/actual 쌍 찾기
        var pairs = [];
        for (var d = 0; d < ds.length; d += 2) {
          if (d+1 < ds.length && ds[d]._group) {
            pairs.push({ pi:d, ai:d+1, color:colorMap[ds[d]._group]||'#374151' });
          }
        }
        for (var i = 0; i < n; i++) {
          for (var g = 0; g < pairs.length; g++) {
            var plan = ds[pairs[g].pi].data[i];
            var actual = ds[pairs[g].ai].data[i];
            var pct = plan ? Math.round(actual/plan*100) : 0;
            var planBar = chart.getDatasetMeta(pairs[g].pi).data[i];
            if (!planBar) continue;
            var actBar = chart.getDatasetMeta(pairs[g].ai).data[i];
            var topY = Math.min(planBar.y, actBar ? actBar.y : planBar.y);

            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '9px system-ui';
            ctx.fillStyle = '#6b7280';
            ctx.fillText('฿'+fmt(plan), planBar.x, topY - 24);
            ctx.font = 'bold 10px system-ui';
            ctx.fillStyle = pairs[g].color;
            ctx.fillText('฿'+fmt(actual)+' ('+pct+'%)', planBar.x, topY - 10);
            ctx.restore();
          }
        }
      }
    }]
  });
}

function _makePieChart(canvasId, teams, data, colors) {
  var fTeams=[], fColors=[], fData=[];
  teams.forEach(function(t,i){ if(data[i]>0){ fTeams.push(t); fColors.push(colors[i]); fData.push(data[i]); } });
  return new Chart(document.getElementById(canvasId), {
    type:'doughnut',
    data:{ labels:fTeams, datasets:[{ data:fData, backgroundColor:fColors, borderWidth:3, borderColor:'#fff' }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:40, bottom:40, left:10, right:60 } },
      animation: _vatAnimPending ? { duration:600, easing:'easeOutCubic' } : { duration:300 },
      plugins:{
        legend:{ position:'left', align:'center', labels:{ font:{size:11}, usePointStyle:true, padding:10, boxWidth:10 } },
        tooltip:{ callbacks:{ label:function(ctx){ var total=ctx.dataset.data.reduce(function(a,b){return a+b;},0); var pct=total?Math.round(ctx.parsed/total*100):0; return ctx.label+': ฿'+fmt(ctx.parsed)+' ('+pct+'%)'; } } },
        datalabels: false
      }
    },
    plugins:[{
      id:'pieLabels',
      afterDraw:function(chart) {
        var ctx = chart.ctx;
        var meta = chart.getDatasetMeta(0);
        var ds = chart.data.datasets[0];
        var total = ds.data.reduce(function(a,b){return a+b;},0);
        if(!total) return;
        var cx = (chart.chartArea.left + chart.chartArea.right) / 2;
        var cy = (chart.chartArea.top + chart.chartArea.bottom) / 2;
        meta.data.forEach(function(arc, i) {
          var val = ds.data[i];
          var pct = Math.round(val/total*100);
          if(pct < 3) return;
          var props = arc.getProps(['startAngle','endAngle','outerRadius']);
          var midAngle = (props.startAngle + props.endAngle) / 2;
          var outerR = props.outerRadius;
          var cosA = Math.cos(midAngle);
          var sinA = Math.sin(midAngle);
          // 연결선 시작점 (도넛 바깥 가장자리)
          var x1 = cx + cosA * outerR;
          var y1 = cy + sinA * outerR;
          // 연결선 중간점
          var x2 = cx + cosA * (outerR + 18);
          var y2 = cy + sinA * (outerR + 18);
          // 연결선 끝점 (수평 꺾임)
          var isRight = cosA >= 0;
          var x3 = x2 + (isRight ? 14 : -14);
          var y3 = y2;
          // 연결선 그리기
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x3, y3);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          ctx.stroke();
          // 텍스트
          ctx.textAlign = isRight ? 'left' : 'right';
          var tx = x3 + (isRight ? 4 : -4);
          ctx.fillStyle = '#1e293b';
          ctx.font = 'bold 12px system-ui';
          ctx.fillText(pct + '%', tx, y3 - 2);
          ctx.font = '10px system-ui';
          ctx.fillStyle = '#6b7280';
          ctx.fillText('฿' + fmt(val), tx, y3 + 11);
          ctx.restore();
        });
      }
    }]
  });
}

function _makeAchievementChart(canvasId, plan, actual, color) {

  var remain = Math.max(0, plan - actual);
  return new Chart(document.getElementById(canvasId), {
    type:'doughnut',
    data:{
      labels:[t('tv_achieved'), t('tv_remaining')],
      datasets:[{ data:[actual, remain], backgroundColor:[color, '#e5e7eb'], borderWidth:3, borderColor:'#fff' }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,

      layout:{ padding:{ top:10, bottom:10, left:10, right:10 } },

      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{ label:function(ctx){ return ctx.label+': ฿'+fmt(ctx.parsed); } } }

    plugins:[{
      id:'centerText',

        var ctx = chart.ctx;

        ctx.font = '12px system-ui';
        ctx.fillStyle = '#6b7280';
        ctx.fillText('฿' + fmt(actual), cx, cy + 16);
        // 계획 금액
        ctx.font = '10px system-ui';

        ctx.fillText('/ ฿' + fmt(plan), cx, cy + 30);
        ctx.restore();

}

function renderCharts(d) {
  var ix = d.monthIndices;
  var showSale = _curTab !== 'receive';
  var showRecv = _curTab !== 'sales';
  var splitRecv = document.getElementById('chkSplitRecv').checked;
  var teamOrder = ['BKK','North East','East','North','South'];

  // 팀별 집계
  var teamSales = {}, teamRecv = {};
  d.sales.forEach(function(s) {
    if (!teamSales[s.team]) teamSales[s.team] = {plan:0,actual:0};
    teamSales[s.team].plan += _vatAdj(_sumArr(s.months, ix));
    teamSales[s.team].actual += _vatAdj(_sumArr(s.actual, ix));
  });
  d.recv.forEach(function(r) {
    if (!teamRecv[r.team]) teamRecv[r.team] = {plan:0,actual:0,impPlan:0,impActual:0,ctPlan:0,ctActual:0};
    teamRecv[r.team].plan += _vatAdj(_sumRecv(r.months, ix, 't'));
    teamRecv[r.team].actual += _vatAdj(_sumArr(r.actual, ix));
    teamRecv[r.team].impPlan += _vatAdj(_sumRecv(r.months, ix, 'p'));
    teamRecv[r.team].impActual += _vatAdj(_sumArr(r.actualImp || [], ix));
    teamRecv[r.team].ctPlan += _vatAdj(_sumRecv(r.months, ix, 'm'));
    teamRecv[r.team].ctActual += _vatAdj(_sumArr(r.actualCt || [], ix));
  });

  var teams = teamOrder.filter(function(t){ return teamSales[t] || teamRecv[t]; });
  var teamColors = teams.map(function(t){ return TEAM_COLORS[t]; });

  // 기존 차트 파괴
  if (_chartBarSale) _chartBarSale.destroy();
  if (_chartPieSale) _chartPieSale.destroy();
  if (_chartBarRecv) _chartBarRecv.destroy();
  if (_chartPieRecv) _chartPieRecv.destroy();
  if (_chartPieRecvImp) _chartPieRecvImp.destroy();
  if (_chartPieRecvCt) _chartPieRecvCt.destroy();
  if (_chartPieRecvTot) _chartPieRecvTot.destroy();
  _chartBarSale = _chartPieSale = _chartBarRecv = _chartPieRecv = null;
  _chartPieRecvImp = _chartPieRecvCt = _chartPieRecvTot = null;

  // 데이터 준비
  var sPlan = teams.map(function(t){return (teamSales[t]||{}).plan||0;});
  var sActual = teams.map(function(t){return (teamSales[t]||{}).actual||0;});
  var rPlan = teams.map(function(t){return (teamRecv[t]||{}).plan||0;});
  var rActual = teams.map(function(t){return (teamRecv[t]||{}).actual||0;});
  var rImpPlan = teams.map(function(t){return (teamRecv[t]||{}).impPlan||0;});
  var rImpActual = teams.map(function(t){return (teamRecv[t]||{}).impActual||0;});
  var rCtPlan = teams.map(function(t){return (teamRecv[t]||{}).ctPlan||0;});
  var rCtActual = teams.map(function(t){return (teamRecv[t]||{}).ctActual||0;});

  // Y축 통일: 매출+수금 전체 최대값 기준
  var allVals = sPlan.concat(sActual, rPlan, rActual);
  var rawMax = Math.max.apply(null, allVals);
  var yMax = Math.ceil(rawMax / 1000000) * 1000000;

  // 전체 합산 데이터
  var totalSPlan = sPlan.reduce(function(a,b){return a+b;},0);
  var totalSActual = sActual.reduce(function(a,b){return a+b;},0);
  var totalRPlan = rPlan.reduce(function(a,b){return a+b;},0);
  var totalRActual = rActual.reduce(function(a,b){return a+b;},0);
  var totalRImpPlan = rImpPlan.reduce(function(a,b){return a+b;},0);
  var totalRImpActual = rImpActual.reduce(function(a,b){return a+b;},0);
  var totalRCtPlan = rCtPlan.reduce(function(a,b){return a+b;},0);
  var totalRCtActual = rCtActual.reduce(function(a,b){return a+b;},0);

  // 팀 필터 확인
  var selTeam = document.getElementById('teamFilter').value;

  // 팀원별 데이터 (팀 모드용)
  function _getMemberData(type, filterTeam) {
    var labels=[], plans=[], actuals=[], colors=[];
    var impPlans=[], impActuals=[], ctPlans=[], ctActuals=[];
    var targetTeams = filterTeam ? [filterTeam] : teams;
    targetTeams.forEach(function(team) {
      var src = type==='sale' ? d.sales : d.recv;
      src.filter(function(s){return s.team===team;}).forEach(function(s) {
        labels.push(s.name);
        colors.push(MEMBER_COLORS[s.name] || TEAM_COLORS[team] || '#6b7280');
        if (type==='sale') {
          plans.push(_vatAdj(_sumArr(s.months, ix)));
          actuals.push(_vatAdj(_sumArr(s.actual, ix)));
        } else {
          plans.push(_vatAdj(_sumRecv(s.months, ix, 't')));
          actuals.push(_vatAdj(_sumArr(s.actual, ix)));
          impPlans.push(_vatAdj(_sumRecv(s.months, ix, 'p')));
          impActuals.push(_vatAdj(_sumArr(s.actualImp || [], ix)));
          ctPlans.push(_vatAdj(_sumRecv(s.months, ix, 'm')));
          ctActuals.push(_vatAdj(_sumArr(s.actualCt || [], ix)));
        }
      });
    });
    return {labels:labels, plans:plans, actuals:actuals, colors:colors, impPlans:impPlans, impActuals:impActuals, ctPlans:ctPlans, ctActuals:ctActuals};
  }

  // 전체 모드 Y축 통일
  var totalMax = Math.max(totalSPlan, totalSActual, totalRPlan, totalRActual);
  var yMaxAll = Math.ceil(totalMax / 1000000) * 1000000;

  // ── Top 3 차트 데이터 ──
  var _isTop3 = document.getElementById('chkTop3').checked;
  var _top3Data = null;
  if (_isTop3) {
    var top3Type = document.getElementById('top3Type').value;
    var pm = {};
    SALES_DATA.forEach(function(s) {
      if (!pm[s.name]) pm[s.name] = {name:s.name, team:s.team, sp:0, sa:0, rp:0, ra:0, rpP:0, rpM:0, aI:0, aC:0};
      pm[s.name].sp += _vatAdj(_sumArr(s.months, ix));
      pm[s.name].sa += _vatAdj(_sumArr(s.actual, ix));
    });
    RECV_DATA.forEach(function(r) {
      if (!pm[r.name]) pm[r.name] = {name:r.name, team:r.team, sp:0, sa:0, rp:0, ra:0, rpP:0, rpM:0, aI:0, aC:0};
      pm[r.name].rp += _vatAdj(_sumRecv(r.months, ix, 't'));
      pm[r.name].ra += _vatAdj(_sumArr(r.actual, ix));
      pm[r.name].rpP += _vatAdj(_sumRecv(r.months, ix, 'p'));
      pm[r.name].rpM += _vatAdj(_sumRecv(r.months, ix, 'm'));
      pm[r.name].aI += _vatAdj(_sumArr(r.actualImp || [], ix));
      pm[r.name].aC += _vatAdj(_sumArr(r.actualCt || [], ix));
    });
    var pa = Object.keys(pm).map(function(k){return pm[k];});
    if (top3Type === 'sales') pa.sort(function(a,b){return b.sa - a.sa;});
    else if (top3Type === 'recv') pa.sort(function(a,b){return b.ra - a.ra;});
    else pa.sort(function(a,b){return (b.sa+b.ra) - (a.sa+a.ra);});
    _top3Data = pa.slice(0, 3);
  }

  // 캐시 저장 (toggleBarMode에서 사용)
  _lastChartData = { d:d, teams:teams, teamColors:teamColors, sPlan:sPlan, sActual:sActual, rPlan:rPlan, rActual:rActual, rImpPlan:rImpPlan, rImpActual:rImpActual, rCtPlan:rCtPlan, rCtActual:rCtActual, totalSPlan:totalSPlan, totalSActual:totalSActual, totalRPlan:totalRPlan, totalRActual:totalRActual, totalRImpPlan:totalRImpPlan, totalRImpActual:totalRImpActual, totalRCtPlan:totalRCtPlan, totalRCtActual:totalRCtActual, yMax:yMax, yMaxAll:yMaxAll, selTeam:selTeam, splitRecv:splitRecv, getMemberData:_getMemberData, isTop3:_isTop3, top3Data:_top3Data };

  // 그리드 컬럼: 둘 다 표시면 2등분, 하나만이면 전체 너비
  var chartFlow = document.getElementById('chartFlow');
  if (chartFlow) {
    if (showSale && showRecv) {
      chartFlow.style.gridTemplateColumns = '1fr 1fr';
      chartFlow.style.gridTemplateAreas = '"sale-bar recv-bar" "sale-pie recv-pie"';
    } else if (showSale) {
      chartFlow.style.gridTemplateColumns = '1fr';
      chartFlow.style.gridTemplateAreas = '"sale-bar" "sale-pie"';
    } else {
      chartFlow.style.gridTemplateColumns = '1fr';
      chartFlow.style.gridTemplateAreas = '"recv-bar" "recv-pie"';
    }
  }

  // 차트 생성 헬퍼
  function _buildChart(type, mode) {
    var isSale = type === 'sale';
    var barId = isSale ? 'chartBarSale' : 'chartBarRecv';
    var pieId = isSale ? 'chartPieSale' : 'chartPieRecv';
    var ptId = isSale ? 'pieTitleSale' : 'pieTitleRecv';
    var color = isSale ? '#2563eb' : '#059669';
    var icon = isSale ? t('tv_sale_label') : t('tv_recv_label');
    var pt = document.getElementById(ptId);
    var useSplit = !isSale && splitRecv;

    // ── Top 3 모드 ──
    if (_isTop3 && _top3Data) {
      var medals = ['🥇','🥈','🥉'];
      var t3Labels = _top3Data.map(function(p,i){ return medals[i]+' '+p.name; });
      var t3Colors = _top3Data.map(function(p){ return MEMBER_COLORS[p.name] || TEAM_COLORS[p.team] || '#6b7280'; });
      pt.textContent = '🏆 ' + icon + ' — Top 3';
      if (isSale) {
        var t3Plans = _top3Data.map(function(p){return p.sp;});
        var t3Actuals = _top3Data.map(function(p){return p.sa;});
        if (!isSale) _hideSplitPie();
        return { bar: _makeBarChart(barId, t3Labels, t3Plans, t3Actuals, t3Colors, null), pie: _makePieChart(pieId, t3Labels, t3Actuals, t3Colors) };
      } else {
        var t3rPlans = _top3Data.map(function(p){return p.rp;});
        var t3rActuals = _top3Data.map(function(p){return p.ra;});
        if (useSplit) {
          var t3impP = _top3Data.map(function(p){return p.rpP;});
          var t3impA = _top3Data.map(function(p){return p.aI;});
          var t3ctP = _top3Data.map(function(p){return p.rpM;});
          var t3ctA = _top3Data.map(function(p){return p.aC;});
          var sIP = t3impP.reduce(function(a,b){return a+b;},0), sIA = t3impA.reduce(function(a,b){return a+b;},0);
          var sCP = t3ctP.reduce(function(a,b){return a+b;},0), sCA = t3ctA.reduce(function(a,b){return a+b;},0);
          var sTP = t3rPlans.reduce(function(a,b){return a+b;},0), sTA = t3rActuals.reduce(function(a,b){return a+b;},0);
          _showSplitPie(sIP, sIA, sCP, sCA, sTP, sTA);
          return { bar: _makeBarChartSplit(barId, t3Labels, t3impP, t3impA, t3ctP, t3ctA, null), pie: null };
        }
        _hideSplitPie();
        return { bar: _makeBarChart(barId, t3Labels, t3rPlans, t3rActuals, t3Colors, null), pie: _makePieChart(pieId, t3Labels, t3rActuals, t3Colors) };
      }
    }

    if (mode === 'all') {
      pt.textContent = '🎯 ' + icon + ' — ' + t('tv_achieve');
      var tp = isSale ? totalSPlan : totalRPlan;
      var ta = isSale ? totalSActual : totalRActual;
      if (useSplit) {
        _showSplitPie(totalRImpPlan, totalRImpActual, totalRCtPlan, totalRCtActual, tp, ta);
        return { bar: _makeBarChartSplit(barId, [t('tv_bar_all')], [totalRImpPlan], [totalRImpActual], [totalRCtPlan], [totalRCtActual], null), pie: null };
      }
      if (!isSale) _hideSplitPie();
      return { bar: _makeBarChart(barId, [t('tv_bar_all')], [tp], [ta], [color], yMaxAll), pie: _makeAchievementChart(pieId, tp, ta, color) };
    } else {
      if (selTeam) {
        pt.textContent = '👥 ' + icon + ' — ' + selTeam + ' ' + t('tv_members');
        var md = _getMemberData(type, selTeam);
        var mColors = md.colors.length ? md.colors : [color];
        if (useSplit) {
          var mIP = md.impPlans.reduce(function(a,b){return a+b;},0), mIA = md.impActuals.reduce(function(a,b){return a+b;},0);
          var mCP = md.ctPlans.reduce(function(a,b){return a+b;},0), mCA = md.ctActuals.reduce(function(a,b){return a+b;},0);
          var mTP = md.plans.reduce(function(a,b){return a+b;},0), mTA = md.actuals.reduce(function(a,b){return a+b;},0);
          _showSplitPie(mIP, mIA, mCP, mCA, mTP, mTA);
          return { bar: _makeBarChartSplit(barId, md.labels, md.impPlans, md.impActuals, md.ctPlans, md.ctActuals, null), pie: null };
        }
        if (!isSale) _hideSplitPie();
        return { bar: _makeBarChart(barId, md.labels, md.plans, md.actuals, mColors, null), pie: _makePieChart(pieId, md.labels, md.actuals, mColors) };
      } else {
        pt.textContent = '🥧 ' + icon + ' — ' + t('tv_team_dist');
        var p = isSale ? sPlan : rPlan;
        var a = isSale ? sActual : rActual;
        if (useSplit) {
          var tIP = rImpPlan.reduce(function(a,b){return a+b;},0), tIA = rImpActual.reduce(function(a,b){return a+b;},0);
          var tCP = rCtPlan.reduce(function(a,b){return a+b;},0), tCA = rCtActual.reduce(function(a,b){return a+b;},0);
          var tTP = rPlan.reduce(function(a,b){return a+b;},0), tTA = rActual.reduce(function(a,b){return a+b;},0);
          _showSplitPie(tIP, tIA, tCP, tCA, tTP, tTA);
          return { bar: _makeBarChartSplit(barId, teams, rImpPlan, rImpActual, rCtPlan, rCtActual, null), pie: null };
        }
        if (!isSale) _hideSplitPie();
        return { bar: _makeBarChart(barId, teams, p, a, teamColors, yMax), pie: _makePieChart(pieId, teams, a, teamColors) };
      }
    }
  }

  // 매출 막대 + 원형
  var boxBarSale = document.getElementById('chartBoxBarSale');
  var boxPieSale = document.getElementById('chartBoxPieSale');
  boxBarSale.style.display = showSale ? '' : 'none';
  boxPieSale.style.display = showSale ? '' : 'none';
  if (showSale) {
    var rs = _buildChart('sale', _barModeSale);
    _chartBarSale = rs.bar; _chartPieSale = rs.pie;
  }

  // 수금 막대 + 원형
  var boxBarRecv = document.getElementById('chartBoxBarRecv');
  var boxPieRecv = document.getElementById('chartBoxPieRecv');
  boxBarRecv.style.display = showRecv ? '' : 'none';
  boxPieRecv.style.display = showRecv ? '' : 'none';
  // 토글 버튼 영역: 수금 표시 + 구분 체크 시만 보임
  var splitArea = document.getElementById('splitToggleArea');
  if (splitArea) splitArea.style.display = (showRecv && splitRecv) ? 'flex' : 'none';
  if (showRecv) {
    var rr = _buildChart('recv', _barModeRecv);
    _chartBarRecv = rr.bar; _chartPieRecv = rr.pie;
  }
}

// ── 로그인 사용자 권한 감지 ──
(function() {
  var user = null;
  try { user = JSON.parse(sessionStorage.getItem('current_user') || 'null'); } catch(e){}
  if (!user) {
    try {
      if (localStorage.getItem('auto_login') === 'true')
        user = JSON.parse(localStorage.getItem('current_user_persist') || 'null');
    } catch(e){}
  }
  if (!user) return; // 로그인 안됨 → 기본 admin(시뮬레이션)

  _isRealUser = true;
  var isAdmin = HARDCODED_ADMINS.indexOf(user.empid) >= 0 || user.role === 'admin';
  var perms = [];
  try {
    var raw = user.permissions || user.perms || [];
    perms = Array.isArray(raw) ? raw : JSON.parse(raw);
  } catch(e){ perms = []; }

  // sub_dept → 팀명 매핑
  var SUBDEPT_MAP = {
    '방콕':'BKK','bangkok':'BKK','BKK':'BKK',
    '북동부':'North East','northeast':'North East','North East':'North East',
    '서부':'East','east':'East','East':'East',
    '북부':'North','north':'North','North':'North',
    '남부':'South','south':'South','South':'South'
  };

  _loggedUserName = user.name || user.empid;
  _loggedUserTeam = SUBDEPT_MAP[user.sub_dept] || user.sub_dept || '';

  // SALES_DATA에서 이름으로 팀 매칭 (sub_dept 매핑 실패 시 폴백)
  if (!_loggedUserTeam) {
    SALES_DATA.forEach(function(s) {
      if (s.name === _loggedUserName) _loggedUserTeam = s.team;
    });
  }

  // ── 직위 × 권한 조합 규칙 ──
  // 열람(target)만: 모든 직위 → 본인만 (member)
  // 승인(target_approve): 팀원/팀장 → 소속팀 (manager), 그룹장/법인장 → 전체 (admin)
  // 재무 부서(sub_dept='재무')는 승인 토글 시 전체 조회 가능 (admin)
  // 승인 판정: target_approve 퍼미션 OR results_approve OR role=='approver' 모두 인정
  var hasApprove = perms.indexOf('target_approve') >= 0
                || perms.indexOf('results_approve') >= 0
                || user.role === 'approver';
  var pos = user.position || 'member'; // member, leader, group_leader, ceo
  // 재무팀 판정: 다국어 sub_dept/dept OR 하드코딩 empid 리스트 (DB 설정 누락 대비)
  var _subDeptRaw = ((user.sub_dept || '') + '').trim().toLowerCase();
  var _deptRaw    = ((user.dept || '') + '').trim().toLowerCase();
  var _FIN_KEYS = ['재무','finance','การเงิน','fin'];
  var isFinance = HARDCODED_FINANCE.indexOf(user.empid) >= 0
               || _FIN_KEYS.some(function(k){ return _subDeptRaw === k.toLowerCase() || _deptRaw === k.toLowerCase(); });

  // SALES_DATA에서 본인 이름 매칭 (닉네임 우선, empid 폴백)
  var _matchedName = '';
  SALES_DATA.forEach(function(s) {
    if (s.name === (user.nickname || '') || s.name === _loggedUserName) _matchedName = s.name;
  });
  // SALES_DATA에서 매칭 안 되면 RECV_DATA에서도 시도
  if (!_matchedName) {
    RECV_DATA.forEach(function(r) {
      if (r.name === (user.nickname || '') || r.name === _loggedUserName) _matchedName = r.name;
    });
  }
  if (_matchedName) _loggedUserName = _matchedName;

  if (isAdmin) {
    _curPerm = 'admin';
  } else if (isFinance) {
    // 재무팀은 승인권 유무와 무관하게 전체 조회 (재무 집계 업무상 전사 데이터 필요)
    _curPerm = 'admin';
  } else if (hasApprove && (pos === 'group_leader' || pos === 'ceo')) {
    // 그룹장/법인장 + 승인 → 전체
    _curPerm = 'admin';
  } else if (hasApprove) {
    // 팀원/팀장 + 승인 → 소속팀
    _curPerm = 'manager';
  } else {
    // 열람만 → 본인만 (이름 매칭 실패 시 소속팀으로 폴백)
    if (_matchedName) {
      _curPerm = 'member';
    } else if (_loggedUserTeam) {
      _curPerm = 'manager'; // 이름 매칭 실패 → 소속팀 데이터 표시
    } else {
      _curPerm = 'member'; // 팀도 없으면 그대로
    }
  }

  // 배지 업데이트
  var posLabel = pos === 'ceo' ? '법인장' : pos === 'group_leader' ? '그룹장' : pos === 'leader' ? '팀장' : '팀원';
  var badge = document.getElementById('permBadge');
  if (_curPerm === 'admin' && isFinance && !isAdmin) {
    badge.className = 'perm-badge admin'; badge.textContent = '💰 재무 (전체)';
  } else if (_curPerm === 'admin' && !isAdmin) {
    badge.className = 'perm-badge admin'; badge.textContent = '👑 ' + posLabel + ' (전체)';
  } else if (_curPerm === 'admin') {
    badge.className = 'perm-badge admin'; badge.textContent = '👑 관리자';
  } else if (_curPerm === 'manager') {
    badge.className = 'perm-badge manager'; badge.textContent = '👔 ' + posLabel + ' (' + _loggedUserTeam + ')';
    // 팀 필터를 자기 팀으로 고정
    var tf = document.getElementById('teamFilter');
    tf.value = _loggedUserTeam;
    tf.disabled = true;
  } else {
    badge.className = 'perm-badge member'; badge.textContent = '👤 ' + posLabel + ' (' + (_matchedName || _loggedUserName) + ')';
    // 필터를 본인으로 고정 후 숨김 (본인만)
    var _pf = document.getElementById('personFilter');
    _pf.value = _matchedName || _loggedUserName;
    if (_loggedUserTeam) document.getElementById('teamFilter').value = _loggedUserTeam;
    document.getElementById('teamFilter').style.display = 'none';
    _pf.style.display = 'none';
    var labels = document.querySelectorAll('.controls label');
    if (labels[0]) labels[0].style.display = 'none';
    if (labels[1]) labels[1].style.display = 'none';
  }

  // 시뮬레이션 영역 숨김
  document.getElementById('permSimArea').style.display = 'none';
  // 파일 업로드/다운로드: admin 레벨만
  if (_curPerm !== 'admin') {
    var uploadBtns = document.querySelectorAll('.upload-btn');
    uploadBtns.forEach(function(b) { b.style.display = 'none'; });
  }
})();

function _openMemberDetail(name) {

  var recv = RECV_DATA.filter(function(r){ return r.name === name; })[0];
