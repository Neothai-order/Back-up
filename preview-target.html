  var team = sale ? sale.team : (recv ? recv.team : '');
  var _f = fmt;

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:16px 16px 0 0;">';
  html += '<span style="font-size:18px;font-weight:700;">📊 ' + name + ' <span style="font-size:13px;font-weight:400;opacity:.8;">(' + team + ')</span></span>';
  html += '<button onclick="this.closest(\'.member-detail-bg\').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;">✕</button>';
  html += '</div>';

  // 매출 상세
  if (sale) {
    html += '<div style="padding:12px 20px 4px;font-size:14px;font-weight:700;color:#b45309;">📈 ' + t('tv_sale_label') + '</div>';
    html += '<div style="padding:0 20px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#fef3c7;"><th style="padding:8px;text-align:left;">월</th><th style="padding:8px;text-align:right;">🦷 임플란트</th><th style="padding:8px;text-align:right;">📷 CT</th><th style="padding:8px;text-align:right;font-weight:800;">합계</th><th style="padding:8px;text-align:right;color:#6b7280;">계획</th><th style="padding:8px;text-align:right;">%</th></tr></thead><tbody>';
    var sTotalImp=0, sTotalCt=0, sTotalAct=0, sTotalPlan=0;
    for (var i=0; i<12; i++) {
      var sImp = sale.actualImp ? (sale.actualImp[i]||0) : 0;
      var sCt = sale.actualCt ? (sale.actualCt[i]||0) : 0;
      var sAct = sale.actual ? (sale.actual[i]||0) : 0;
      var sPlan = sale.months ? (sale.months[i]||0) : 0;
      if (sAct === 0 && sPlan === 0) continue;
      sTotalImp+=sImp; sTotalCt+=sCt; sTotalAct+=sAct; sTotalPlan+=sPlan;
      var sPct = sPlan ? Math.round(sAct/sPlan*100) : 0;
      var bg = i%2===0 ? '#fff' : '#f9fafb';
      html += '<tr style="background:'+bg+';border-bottom:1px solid #f3f4f6;"><td style="padding:8px;">'+MONTHS[i]+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#b45309;">฿'+_f(_vatAdj(sImp))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#7c3aed;">฿'+_f(_vatAdj(sCt))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;">฿'+_f(_vatAdj(sAct))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(sPlan))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;color:'+(sPct>=100?'#16a34a':sPct>=50?'#d97706':'#ef4444')+';">'+sPct+'%</td></tr>';
    }
    var stPct = sTotalPlan ? Math.round(sTotalAct/sTotalPlan*100) : 0;
    html += '<tr style="background:#fef9c3;font-weight:700;border-top:2px solid #d97706;"><td style="padding:8px;">합계</td>';
    html += '<td style="padding:8px;text-align:right;color:#b45309;">฿'+_f(_vatAdj(sTotalImp))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#7c3aed;">฿'+_f(_vatAdj(sTotalCt))+'</td>';
    html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(sTotalAct))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(sTotalPlan))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:'+(stPct>=100?'#16a34a':stPct>=50?'#d97706':'#ef4444')+';">'+stPct+'%</td></tr>';
    html += '</tbody></table></div>';
  }

  // 수금 상세
  if (recv) {
    html += '<div style="padding:12px 20px 4px;font-size:14px;font-weight:700;color:#166534;">💰 ' + t('tv_recv_label') + '</div>';
    html += '<div style="padding:0 20px 16px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#dcfce7;"><th style="padding:8px;text-align:left;">월</th><th style="padding:8px;text-align:right;">🦷 임플란트</th><th style="padding:8px;text-align:right;">📷 CT</th><th style="padding:8px;text-align:right;font-weight:800;">합계</th><th style="padding:8px;text-align:right;color:#6b7280;">계획</th><th style="padding:8px;text-align:right;">%</th></tr></thead><tbody>';
    var rTotalImp=0, rTotalCt=0, rTotalAct=0, rTotalPlan=0;
    for (var j=0; j<12; j++) {
      var rImp = recv.actualImp ? (recv.actualImp[j]||0) : 0;
      var rCt = recv.actualCt ? (recv.actualCt[j]||0) : 0;
      var rAct = recv.actual ? (recv.actual[j]||0) : 0;
      var rPlanT = recv.months ? (typeof recv.months[j]==='object' ? (recv.months[j].t||0) : (recv.months[j]||0)) : 0;
      if (rAct === 0 && rPlanT === 0) continue;
      rTotalImp+=rImp; rTotalCt+=rCt; rTotalAct+=rAct; rTotalPlan+=rPlanT;
      var rPct = rPlanT ? Math.round(rAct/rPlanT*100) : 0;
      var bg2 = j%2===0 ? '#fff' : '#f9fafb';
      html += '<tr style="background:'+bg2+';border-bottom:1px solid #f3f4f6;"><td style="padding:8px;">'+MONTHS[j]+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#b45309;">฿'+_f(_vatAdj(rImp))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#7c3aed;">฿'+_f(_vatAdj(rCt))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;">฿'+_f(_vatAdj(rAct))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(rPlanT))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;color:'+(rPct>=100?'#16a34a':rPct>=50?'#d97706':'#ef4444')+';">'+rPct+'%</td></tr>';
    }
    var rtPct = rTotalPlan ? Math.round(rTotalAct/rTotalPlan*100) : 0;
    html += '<tr style="background:#d1fae5;font-weight:700;border-top:2px solid #16a34a;"><td style="padding:8px;">합계</td>';
    html += '<td style="padding:8px;text-align:right;color:#b45309;">฿'+_f(_vatAdj(rTotalImp))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#7c3aed;">฿'+_f(_vatAdj(rTotalCt))+'</td>';
    html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(rTotalAct))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(rTotalPlan))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:'+(rtPct>=100?'#16a34a':rtPct>=50?'#d97706':'#ef4444')+';">'+rtPct+'%</td></tr>';
    html += '</tbody></table></div>';
  }

  // 모달 생성
  var bg = document.createElement('div');
  bg.className = 'member-detail-bg';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;';
  bg.addEventListener('click', function(e) { if (e.target === bg) bg.remove(); });
  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:16px;width:100%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);';
  modal.innerHTML = html;
  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function _openTeamDetail(teamName) {
  var sales = SALES_DATA.filter(function(s){ return s.team === teamName; });
  var recvs = RECV_DATA.filter(function(r){ return r.team === teamName; });
  if (!sales.length && !recvs.length) return;

  var _f = fmt;
  var ix = _getMonthIndices();

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:16px 16px 0 0;">';
  html += '<span style="font-size:18px;font-weight:700;">🏢 ' + teamName + ' '+t('tv_team_detail')+'</span>';
  html += '<button onclick="this.closest(\'.member-detail-bg\').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;">✕</button>';
  html += '</div>';

  // 팀원 목록 수집
  var memberNames = [];
  sales.forEach(function(s){ if (memberNames.indexOf(s.name)<0) memberNames.push(s.name); });
  recvs.forEach(function(r){ if (memberNames.indexOf(r.name)<0) memberNames.push(r.name); });

  // 매출 상세 테이블
  if (_curTab !== 'receive') {
    html += '<div style="padding:12px 20px 4px;font-size:14px;font-weight:700;color:#1e40af;">📈 '+t('tv_sale_label')+'</div>';
    html += '<div style="padding:0 20px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#dbeafe;"><th style="padding:8px;text-align:left;">'+t('tv_name')+'</th>';
    // 월별 헤더
    for (var mi=0; mi<ix.length; mi++) html += '<th style="padding:8px;text-align:right;">'+MONTHS[ix[mi]]+'</th>';
    html += '<th style="padding:8px;text-align:right;font-weight:800;">'+t('tv_total')+'</th><th style="padding:8px;text-align:right;color:#6b7280;">'+t('tv_plan')+'</th><th style="padding:8px;text-align:right;">%</th></tr></thead><tbody>';
    var grandSA=0, grandSP=0;
    memberNames.forEach(function(name, idx) {
      var s = sales.filter(function(x){return x.name===name;})[0];
      if (!s) return;
      var bg = idx%2===0 ? '#fff' : '#f9fafb';
      html += '<tr style="background:'+bg+';border-bottom:1px solid #f3f4f6;cursor:pointer;" onclick="_openMemberDetail(\''+name+'\')">';
      html += '<td style="padding:8px;font-weight:600;">'+name+'</td>';
      var total=0, plan=0;
      for (var mi2=0; mi2<ix.length; mi2++) {
        var v = s.actual ? (s.actual[ix[mi2]]||0) : 0;
        total += v;
        html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(v))+'</td>';
      }
      plan = _sumArr(s.months, ix);
      grandSA+=total; grandSP+=plan;
      var pct = plan ? Math.round(total/plan*100) : 0;
      html += '<td style="padding:8px;text-align:right;font-weight:700;">฿'+_f(_vatAdj(total))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(plan))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;color:'+(pct>=100?'#16a34a':pct>=50?'#d97706':'#ef4444')+';">'+pct+'%</td></tr>';
    });
    var gsPct = grandSP ? Math.round(grandSA/grandSP*100) : 0;
    html += '<tr style="background:#dbeafe;font-weight:700;border-top:2px solid #2563eb;"><td style="padding:8px;">'+teamName+' '+t('tv_total')+'</td>';
    for (var mi3=0; mi3<ix.length; mi3++) {
      var colT=0; sales.forEach(function(s){ colT += s.actual ? (s.actual[ix[mi3]]||0) : 0; });
      html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(colT))+'</td>';
    }
    html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(grandSA))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(grandSP))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:'+(gsPct>=100?'#16a34a':gsPct>=50?'#d97706':'#ef4444')+';">'+gsPct+'%</td></tr>';
    html += '</tbody></table></div>';
  }

  // 수금 상세 테이블
  if (_curTab !== 'sales') {
    html += '<div style="padding:12px 20px 4px;font-size:14px;font-weight:700;color:#166534;">💰 '+t('tv_recv_label')+'</div>';
    html += '<div style="padding:0 20px 16px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
    html += '<thead><tr style="background:#dcfce7;"><th style="padding:8px;text-align:left;">'+t('tv_name')+'</th>';
    for (var ri=0; ri<ix.length; ri++) html += '<th style="padding:8px;text-align:right;">'+MONTHS[ix[ri]]+'</th>';
    html += '<th style="padding:8px;text-align:right;font-weight:800;">'+t('tv_total')+'</th><th style="padding:8px;text-align:right;color:#6b7280;">'+t('tv_plan')+'</th><th style="padding:8px;text-align:right;">%</th></tr></thead><tbody>';
    var grandRA=0, grandRP=0;
    memberNames.forEach(function(name, idx) {
      var r = recvs.filter(function(x){return x.name===name;})[0];
      if (!r) return;
      var bg2 = idx%2===0 ? '#fff' : '#f9fafb';
      html += '<tr style="background:'+bg2+';border-bottom:1px solid #f3f4f6;cursor:pointer;" onclick="_openMemberDetail(\''+name+'\')">';
      html += '<td style="padding:8px;font-weight:600;">'+name+'</td>';
      var total2=0, plan2=0;
      for (var ri2=0; ri2<ix.length; ri2++) {
        var v2 = r.actual ? (r.actual[ix[ri2]]||0) : 0;
        total2 += v2;
        html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(v2))+'</td>';
      }
      plan2 = _sumRecv(r.months, ix, 't');
      grandRA+=total2; grandRP+=plan2;
      var pct2 = plan2 ? Math.round(total2/plan2*100) : 0;
      html += '<td style="padding:8px;text-align:right;font-weight:700;">฿'+_f(_vatAdj(total2))+'</td>';
      html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(plan2))+'</td>';
      html += '<td style="padding:8px;text-align:right;font-weight:700;color:'+(pct2>=100?'#16a34a':pct2>=50?'#d97706':'#ef4444')+';">'+pct2+'%</td></tr>';
    });
    var grPct = grandRP ? Math.round(grandRA/grandRP*100) : 0;
    html += '<tr style="background:#d1fae5;font-weight:700;border-top:2px solid #16a34a;"><td style="padding:8px;">'+teamName+' '+t('tv_total')+'</td>';
    for (var ri3=0; ri3<ix.length; ri3++) {
      var colR=0; recvs.forEach(function(r2){ colR += r2.actual ? (r2.actual[ix[ri3]]||0) : 0; });
      html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(colR))+'</td>';
    }
    html += '<td style="padding:8px;text-align:right;">฿'+_f(_vatAdj(grandRA))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:#6b7280;">฿'+_f(_vatAdj(grandRP))+'</td>';
    html += '<td style="padding:8px;text-align:right;color:'+(grPct>=100?'#16a34a':grPct>=50?'#d97706':'#ef4444')+';">'+grPct+'%</td></tr>';
    html += '</tbody></table></div>';
  }

  var bg = document.createElement('div');
  bg.className = 'member-detail-bg';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;';
  bg.addEventListener('click', function(e) { if (e.target === bg) bg.remove(); });
  var modal = document.createElement('div');
  modal.style.cssText = 'background:#fff;border-radius:16px;width:100%;max-width:850px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);';
  modal.innerHTML = html;
  bg.appendChild(modal);
  document.body.appendChild(bg);
}

function _getMonthIndices() {
  var p = _parsePeriod(document.getElementById('monthFilter').value);
  if (p.indices == null) {
    var arr = []; for (var i=0;i<12;i++) arr.push(i); return arr;
  }
  return p.indices;
}
