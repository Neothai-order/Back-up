<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans KR','Noto Sans Thai',sans-serif;background:#f0f4f8;min-height:100vh;-webkit-user-select:none;user-select:none}
/* 상단 헤더 바는 page-header.js가 렌더링 */
.sch-hdr-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sch-hdr-btn:hover{background:rgba(255,255,255,.35)}
.container{max-width:900px;margin:0 auto;padding:12px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.toolbar .btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.btn-primary{background:#0891b2;color:#fff}
.btn-primary:hover{background:#0e7490}
.btn-secondary{background:#e2e8f0;color:#334155}
.btn-secondary:hover{background:#cbd5e1}
.btn-secondary.active{background:#0891b2;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#fecaca}
.admin-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:#64748b}
.admin-toggle input{accent-color:#0891b2}

/* Week overview */
.week-overview{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.week-overview h3{font-size:13px;color:#64748b;margin-bottom:8px}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week-day-box{text-align:center;padding:6px 2px;border-radius:8px;background:#f8fafc;font-size:11px;cursor:pointer;transition:background .15s}
.week-day-box:hover{background:#e0f2fe}
.week-day-box.today{background:#0891b2;color:#fff;font-weight:700}
.week-day-box .day-label{font-weight:600;margin-bottom:2px}
.week-day-box .day-num{font-size:14px;font-weight:700}
.week-day-box .dot-row{display:flex;justify-content:center;gap:2px;margin-top:3px;min-height:6px}
.week-day-box .dot-row .wdot{width:6px;height:6px;border-radius:50%}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.cal-nav button{background:none;border:none;font-size:22px;cursor:pointer;color:#0891b2;padding:4px 8px;border-radius:6px}
.cal-nav button:hover{background:#e0f2fe}
.cal-nav .month-label{font-size:16px;font-weight:700;color:#1e293b;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal-header-cell{text-align:center;font-size:12px;font-weight:700;color:#64748b;padding:6px 0}
.cal-header-cell.sun{color:#ef4444}
.cal-header-cell.sat{color:#3b82f6}
.cal-cell{background:#fff;border-radius:8px;min-height:60px;padding:4px;cursor:pointer;transition:background .15s;position:relative;border:2px solid transparent}
.cal-cell:hover{background:#f0f9ff}
.cal-cell.other-month{background:#f8fafc;opacity:.5}
.cal-cell.today{border-color:#0891b2}
.cal-cell.selected{background:#e0f2fe;border-color:#0891b2}
.cal-cell.weekend{background:#fafafa}
.cal-cell .day-num{font-size:12px;font-weight:600;color:#334155}
.cal-cell.sun .day-num{color:#ef4444}
.cal-cell.sat .day-num{color:#3b82f6}
.cal-cell .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.cal-cell .dots .cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-cell .count-badge{font-size:9px;color:#64748b;margin-top:1px}

/* Day schedule list */
.day-schedules{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.day-schedules h3{font-size:14px;color:#1e293b;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.no-data{text-align:center;color:#94a3b8;padding:20px;font-size:13px}

/* Schedule card */
.sched-card{background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid #3b82f6}
.sched-card.priority-high{border-left-color:#ef4444}
.sched-card.priority-low{border-left-color:#94a3b8}
.sched-card .sc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sched-card .sc-time{font-weight:700;color:#0891b2;font-size:14px}
.sched-card .sc-customer{font-weight:600;color:#1e293b;font-size:14px}
.type-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff}
.type-regular{background:#3b82f6}
.type-new{background:#22c55e}
.type-follow_up{background:#f59e0b}
.type-complaint{background:#ef4444}
.type-demo{background:#8b5cf6}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status-planned{background:#dbeafe;color:#1d4ed8}
.status-completed{background:#dcfce7;color:#166534}
.status-cancelled{background:#f1f5f9;color:#64748b}
.status-postponed{background:#fef3c7;color:#92400e}
.priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.priority-dot.high{background:#ef4444}
.priority-dot.normal{background:#3b82f6}
.priority-dot.low{background:#94a3b8}
.sched-card .sc-info{font-size:12px;color:#64748b;margin-bottom:4px}
.sched-card .sc-purpose{font-size:12px;color:#475569;margin-bottom:6px}
.sched-card .sc-actions{display:flex;gap:6px;flex-wrap:wrap}
.sched-card .sc-emp{font-size:11px;color:#0891b2;font-weight:600}

/* List view */
.list-group-date{font-size:13px;font-weight:700;color:#0891b2;padding:8px 0 4px;border-bottom:1px solid #e2e8f0;margin-top:12px}
.list-group-date:first-child{margin-top:0}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-start;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:500px;margin:20px auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:14px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;color:#1e293b}
.modal-header .close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;padding:4px}
.modal-body{padding:16px;max-height:65vh;overflow-y:auto}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#0891b2;box-shadow:0 0 0 2px rgba(8,145,178,.15)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-footer{padding:12px 16px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px}

/* Postpone mini modal */
.postpone-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:20px;z-index:300;box-shadow:0 20px 60px rgba(0,0,0,.3);width:280px}
.postpone-modal.show{display:block}
.postpone-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:250}
.postpone-backdrop.show{display:block}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Spinner */
.spinner-wrap{display:flex;justify-content:center;padding:30px}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#0891b2;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Autocomplete dropdown (fixed, outside modal overflow) */
.ac-dropdown{display:none;position:fixed;background:#fff;border:1px solid #d1d5db;border-radius:0 0 10px 10px;max-height:240px;overflow-y:auto;z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.ac-dropdown.show{display:block}
.ac-dropdown .ac-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px}
.ac-dropdown .ac-item:hover{background:#f0f9ff}
.ac-dropdown .ac-item:last-child{border-bottom:none}
.ac-dropdown .ac-erp{color:#6366f1;font-weight:700;font-size:13px;white-space:nowrap}
.ac-dropdown .ac-main{flex:1;min-width:0}
.ac-dropdown .ac-name{font-size:13px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ac-dropdown .ac-nt{font-size:10px;color:#2563eb;background:#eff6ff;padding:1px 6px;border-radius:4px;font-weight:600}
.ac-dropdown .ac-sub{font-size:11px;color:#9ca3af;margin-top:1px}
/* Selected customer card */
.cust-card{display:none;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px 12px;align-items:center;gap:10px;margin-top:4px}
.cust-card.show{display:flex}
.cust-card .cc-info{flex:1}
.cust-card .cc-erp{font-size:11px;color:#0891b2;font-weight:700;background:#e0f2fe;padding:1px 8px;border-radius:10px;display:inline-block}
.cust-card .cc-name{font-size:14px;font-weight:600;color:#1e293b;margin-top:2px}
.cust-card .cc-sub{font-size:11px;color:#64748b}
.cust-card .cc-clear{background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.cust-card .cc-clear:hover{background:#fee2e2;color:#ef4444}

@media(max-width:600px){
  .cal-cell{min-height:44px;padding:2px}
  .cal-cell .day-num{font-size:11px}
  .cal-cell .dots .cdot{width:5px;height:5px}
  .form-row{grid-template-columns:1fr}
  .container{padding:8px}
  .toolbar{gap:4px}
  .toolbar .btn{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body oncontextmenu="event.preventDefault();">

<!-- 헤더 (page-header.js가 렌더링) -->
<div id="pageTopBar"></div>

<div class="container">
  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openNewModal()">&#43; <span data-t="vs_new">새 일정</span></button>
    <button class="btn btn-secondary active" id="btnCalView" onclick="switchView('calendar')"><span data-t="vs_calendar">달력</span></button>
    <button class="btn btn-secondary" id="btnListView" onclick="switchView('list')"><span data-t="vs_list">목록</span></button>
    <button class="btn btn-secondary" onclick="goToday()"><span data-t="vs_today">오늘</span></button>
    <div class="admin-toggle" id="adminToggle" style="display:none">
      <label><input type="checkbox" id="chkAllEmp" onchange="toggleAllEmployees()"> 전체 직원</label>
    </div>
  </div>

  <!-- Week overview -->
  <div class="week-overview">
    <h3 id="weekTitle">이번 주</h3>
    <div class="week-days" id="weekDays"></div>
  </div>

  <!-- Calendar view -->
  <div id="calendarView">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">&#9664;</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">&#9654;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="day-schedules" id="daySchedules" style="display:none">
      <h3 id="daySchedTitle"></h3>
      <div id="daySchedList"></div>
    </div>
  </div>

  <!-- List view -->
  <div id="listView" style="display:none">
    <div class="day-schedules">
      <div id="listContent"></div>
    </div>
  </div>
</div>

<!-- New/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formTitle">새 일정</h3>
      <button class="close-btn" onclick="closeFormModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editDocId">
      <div class="form-row">
        <div class="form-group">
          <label data-t="vs_date">날짜</label>
          <input type="date" id="fDate">
        </div>
        <div class="form-group">
          <label data-t="vs_time">시간</label>
          <input type="time" id="fTime">
        </div>
      </div>
      <div class="form-group">
        <label data-t="vs_customer">고객</label>
        <div id="custSearchWrap">
          <input type="text" id="fCustomer" placeholder="ERP 코드 또는 고객명 검색" autocomplete="off">
        </div>
        <div class="cust-card" id="custCard">
          <div class="cc-info">
            <span class="cc-erp" id="ccErp"></span>
            <div class="cc-name" id="ccName"></div>
            <div class="cc-sub" id="ccSub"></div>
          </div>
          <button class="cc-clear" onclick="clearCust()" title="변경">&#x2715;</button>
        </div>
        <input type="hidden" id="fErp">
        <input type="hidden" id="fCustName">
      </div>
      <div class="form-group">
        <label data-t="vs_address">주소</label>
        <input type="text" id="fAddress" placeholder="Address">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label data-t="vs_type">방문 유형</label>
          <select id="fType">
            <option value="regular">정기방문</option>
            <option value="new">신규방문</option>
            <option value="follow_up">후속방문</option>
            <option value="complaint">클레임</option>
            <option value="demo">데모</option>
          </select>
        </div>
        <div class="form-group">
          <label data-t="vs_priority">우선순위</label>
          <select id="fPriority">
            <option value="normal">보통</option>
            <option value="high">높음</option>
            <option value="low">낮음</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label data-t="vs_purpose">방문 목적</label>
        <textarea id="fPurpose" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label data-t="vs_notes">메모</label>
        <textarea id="fNotes" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormModal()" data-t="vs_cancel">취소</button>
      <button class="btn btn-primary" onclick="saveSchedule()" data-t="vs_save">저장</button>
    </div>
  </div>
</div>

<!-- Postpone modal -->
<div class="postpone-backdrop" id="postponeBackdrop"></div>
<div class="postpone-modal" id="postponeModal">
  <h3 style="font-size:14px;margin-bottom:12px" data-t="vs_postpone">연기</h3>
  <div class="form-group">
    <label data-t="vs_date">새 날짜</label>
    <input type="date" id="postponeDate">
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button class="btn btn-secondary btn-sm" onclick="closePostpone()" data-t="vs_cancel">취소</button>
    <button class="btn btn-primary btn-sm" onclick="confirmPostpone()" data-t="vs_save">확인</button>
  </div>
</div>

<!-- Autocomplete dropdown (outside modal) -->
<div class="ac-dropdown" id="acDropdown"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

  th:['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']
};

function _t(key) {
  var entry = _i18n[key];
  if (!entry) return key;
  return entry[_lang] || entry['ko'] || key;
}
function _vtLabel(type) {
  var e = _visitTypeLabels[type];
  return e ? (e[_lang]||e['ko']||type) : type;
}

// Customer data for autocomplete — uses shared per-user IDB cache (customer-cache-shim.js).
// Cache hit → return immediately; background incremental sync refreshes _custData on change.
var _custData = [];
function _mapCust(d) {
  var name = d.name_th || d.cust_name || d.name_en || d.company || d.name || '';
  return { erp: d.erp || '', ntCode: d.nt_code || '', name: name, nameEn: d.name_en || '', address: d.address || d.province || d.location || '' };
}
function _loadCustomers() {
  if (typeof loadCustomersCached !== 'function') {
    console.warn('[Schedule] customer-cache-shim missing — aborting customer load.');
    return;
  }
  loadCustomersCached({
    db: db,
    onCache: function(rows) { _custData = rows.map(_mapCust); console.log('[Schedule] cache hit:', _custData.length); },
    onSync:  function(rows) { _custData = rows.map(_mapCust); console.log('[Schedule] bg sync updated:', _custData.length); }
  }).then(function(rows) {
    if (!_custData.length) {
      _custData = (rows||[]).map(_mapCust);
      console.log('[Schedule] cold-start loaded:', _custData.length);
    }
  }).catch(function(e) { console.warn('[Schedule] Customer load failed:', e); });
}
function _positionAC() {
  var inp = document.getElementById('fCustomer');
  var dd = document.getElementById('acDropdown');
  var rect = inp.getBoundingClientRect();
  dd.style.top = rect.bottom + 'px';
  dd.style.left = rect.left + 'px';
  dd.style.width = rect.width + 'px';
}
function selectCust(c) {
  document.getElementById('fErp').value = c.erp;
  document.getElementById('fCustName').value = c.name;
  document.getElementById('fAddress').value = c.address || '';
  document.getElementById('ccErp').textContent = c.erp ? '[' + c.erp + ']' : '';
  document.getElementById('ccName').textContent = c.name;
  document.getElementById('ccSub').textContent = c.nameEn && c.nameEn !== c.name ? c.nameEn : '';
  document.getElementById('custSearchWrap').style.display = 'none';
  document.getElementById('custCard').classList.add('show');
  document.getElementById('acDropdown').classList.remove('show');
}
function clearCust() {
  document.getElementById('fErp').value = '';
  document.getElementById('fCustName').value = '';
  document.getElementById('fCustomer').value = '';
  document.getElementById('fAddress').value = '';
  document.getElementById('custSearchWrap').style.display = '';
  document.getElementById('custCard').classList.remove('show');
  document.getElementById('fCustomer').focus();
}
function _setupAC() {
  var custIn = document.getElementById('fCustomer');
  var dd = document.getElementById('acDropdown');
  var timer;
  custIn.addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      var q = custIn.value.trim().toLowerCase();
      if (!q) { dd.classList.remove('show'); return; }
      var qNoSpace = q.replace(/\s+/g, '');
      var qIsNum = /^\d+$/.test(q);
      var matches = _custData.filter(function(c) {
        var hay = (c.erp + ' ' + c.ntCode + ' ' + c.name + ' ' + c.nameEn).toLowerCase().replace(/\s+/g, '');
        if (hay.indexOf(qNoSpace) >= 0) return true;
        if (qIsNum && c.ntCode && c.ntCode.toLowerCase().replace(/^nt/i, '').indexOf(q) >= 0) return true;
        return false;
      }).slice(0, 10);
      if (!matches.length) { dd.classList.remove('show'); return; }
      dd.innerHTML = matches.map(function(c) {
        var erpStr = c.erp ? '[' + esc(c.erp) + '] ' : '';
        var mainName = c.name;
        var ntTag = c.ntCode ? '<span class="ac-nt">' + esc(c.ntCode) + '</span>' : '';
        var subName = c.nameEn && c.nameEn !== c.name ? c.nameEn : '';
        return '<div class="ac-item" data-idx="' + _custData.indexOf(c) + '">' +
          '<div class="ac-main">' +
            '<div class="ac-name">' + esc(erpStr) + esc(mainName) + '  ' + ntTag + '</div>' +
            (subName ? '<div class="ac-sub">' + esc(subName) + '</div>' : '') +
          '</div></div>';
      }).join('');
      dd.querySelectorAll('.ac-item').forEach(function(el, i) {
        el.onclick = function(e) { e.stopPropagation(); selectCust(matches[i]); };
      });
      _positionAC();
      dd.classList.add('show');
    }, 150);
  });

  // reposition on modal scroll
  var mb = document.querySelector('.modal-body');
  if (mb) mb.addEventListener('scroll', function() { if (dd.classList.contains('show')) _positionAC(); });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#custSearchWrap') && !e.target.closest('#acDropdown')) {
      dd.classList.remove('show');
    }
  });
}

// State
var currentUser = null;
var showAllEmployees = false;
var currentView = 'calendar';
var calYear, calMonth; // 0-indexed month
var selectedDate = null;
var allSchedules = []; // fetched docs
var postponeDocId = null;

// Init
window.addEventListener('DOMContentLoaded', function() {
  // 공용 헤더 렌더
  var _schHdr = renderPageTopBar({
    titleHtml: '<span style="font-size:20px">&#x1F4C5;</span> <span id="headerTitle">방문 스케줄</span>',
    showBack: false, theme: 'gradient',

  });

    '<button class="sch-hdr-btn" onclick="toggleFullscreen()" title="Fullscreen">&#x26F6;</button>' +
    '<button class="sch-hdr-btn" onclick="history.back()" title="Close">&#x2715;</button>';

function applyTranslations() {
  document.getElementById('headerTitle').textContent = _t('vs_title');
  document.getElementById('weekTitle').textContent = _t('vs_this_week');
  document.querySelectorAll('[data-t]').forEach(function(el) {

  });

  sel.options[1].textContent = _vtLabel('new');
  sel.options[2].textContent = _vtLabel('follow_up');

  psel.options[1].textContent = _t('vs_priority_high');

}

// Data
function loadData() {
  var q = db.collection('visit_schedules');
  if (!showAllEmployees || !_isAdmin(currentUser)) {
    q = q.where('empid', '==', currentUser.empid);
  }
  // Fetch a wide range for calendar
  var startDate = calYear + '-' + String(calMonth).padStart(2,'0') + '-01';
  var endMonth = calMonth + 2;
  var endYear = calYear;
  if (endMonth > 12) { endMonth -= 12; endYear++; }
  var endDate = endYear + '-' + String(endMonth).padStart(2,'0') + '-28';
  // Actually fetch broadly for current month view + week
  q.orderBy('date','asc').get().then(function(snap) {
    allSchedules = [];
    snap.forEach(function(doc) {
      var d = doc.data();
      d._id = doc.id;
      allSchedules.push(d);
    });
    render();
  }).catch(function(e) {
    console.error('Load error:', e);
    allSchedules = [];
    render();
  });
}

function render() {
  renderWeekOverview();
  renderCalendar();
  renderDaySchedules();
  if (currentView === 'list') renderListView();
}

// Week overview
function renderWeekOverview() {
  var today = new Date();
  var dow = today.getDay(); // 0=Sun
  var startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - dow);
  var container = document.getElementById('weekDays');
  container.innerHTML = '';
  var days = _dayNames[_lang] || _dayNames['ko'];
  for (var i = 0; i < 7; i++) {
    var d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    var ds = formatDate(d);
    var dayScheds = allSchedules.filter(function(s) { return s.date === ds; });
    var isToday = ds === formatDate(today);
    var box = document.createElement('div');
    box.className = 'week-day-box' + (isToday ? ' today' : '');
    box.innerHTML = '<div class="day-label">' + days[i] + '</div><div class="day-num">' + d.getDate() + '</div><div class="dot-row">' +
      dayScheds.slice(0, 4).map(function(s) { return '<div class="wdot" style="background:' + (_typeColors[s.visit_type]||'#94a3b8') + '"></div>'; }).join('') + '</div>';
    (function(dateStr) {
      box.onclick = function() {
        selectedDate = dateStr;
        var dd = new Date(dateStr);
        calYear = dd.getFullYear();
        calMonth = dd.getMonth();
        switchView('calendar');
        render();
      };
    })(ds);
    container.appendChild(box);
  }
}

// Calendar
function renderCalendar() {
  var grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  var days = _dayNames[_lang] || _dayNames['ko'];
  // Header
  for (var h = 0; h < 7; h++) {
    var hc = document.createElement('div');
    hc.className = 'cal-header-cell' + (h === 0 ? ' sun' : '') + (h === 6 ? ' sat' : '');
    hc.textContent = days[h];
    grid.appendChild(hc);
  }
  // Month label
  var mNames = _monthNames[_lang] || _monthNames['ko'];
  document.getElementById('monthLabel').textContent = calYear + ' ' + mNames[calMonth];

  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();
  var todayStr = formatDate(new Date());

  // Previous month fill
  for (var p = firstDay - 1; p >= 0; p--) {
    var pDate = new Date(calYear, calMonth - 1, prevDays - p);
    grid.appendChild(createCalCell(pDate, true));
  }
  // Current month
  for (var d = 1; d <= daysInMonth; d++) {
    var cDate = new Date(calYear, calMonth, d);
    grid.appendChild(createCalCell(cDate, false));
  }
  // Next month fill
  var totalCells = firstDay + daysInMonth;
  var remaining = (7 - (totalCells % 7)) % 7;
  for (var n = 1; n <= remaining; n++) {
    var nDate = new Date(calYear, calMonth + 1, n);
    grid.appendChild(createCalCell(nDate, true));
  }
}

function createCalCell(date, isOther) {
  var ds = formatDate(date);
  var dow = date.getDay();
  var todayStr = formatDate(new Date());
  var dayScheds = allSchedules.filter(function(s) { return s.date === ds && s.status !== 'cancelled'; });

  var cell = document.createElement('div');
  var cls = 'cal-cell';
  if (isOther) cls += ' other-month';
  if (ds === todayStr) cls += ' today';
  if (ds === selectedDate) cls += ' selected';
  if (dow === 0) cls += ' weekend sun';
  else if (dow === 6) cls += ' weekend sat';
  cell.className = cls;

  var html = '<div class="day-num">' + date.getDate() + '</div>';
  if (dayScheds.length > 0) {
    html += '<div class="dots">';
    var shown = dayScheds.slice(0, 5);
    shown.forEach(function(s) {
      html += '<div class="cdot" style="background:' + (_typeColors[s.visit_type]||'#94a3b8') + '"></div>';
    });
    html += '</div>';
    if (dayScheds.length > 5) {
      html += '<div class="count-badge">+' + (dayScheds.length - 5) + '</div>';
    }
  }
  cell.innerHTML = html;
  (function(dateStr) {
    cell.onclick = function() {
      selectedDate = dateStr;
      renderCalendar();
      renderDaySchedules();
    };
  })(ds);
  return cell;
}

function renderDaySchedules() {
  var container = document.getElementById('daySchedules');
  if (!selectedDate) { container.style.display = 'none'; return; }
  container.style.display = 'block';
  var dayScheds = allSchedules.filter(function(s) { return s.date === selectedDate; });
  dayScheds.sort(function(a, b) { return (a.time || '99:99').localeCompare(b.time || '99:99'); });

  var d = new Date(selectedDate);
  var dayNames = _dayNames[_lang] || _dayNames['ko'];
  document.getElementById('daySchedTitle').textContent = selectedDate + ' (' + dayNames[d.getDay()] + ') - ' + dayScheds.length + _t('vs_new').charAt(0);

  var list = document.getElementById('daySchedList');
  if (dayScheds.length === 0) {
    list.innerHTML = '<div class="no-data">' + _t('vs_no_schedule') + '</div>';
    return;
  }
  list.innerHTML = dayScheds.map(function(s) { return buildCardHtml(s); }).join('');
}

function buildCardHtml(s) {
  var priorityClass = 'priority-' + (s.priority || 'normal');
  var html = '<div class="sched-card ' + priorityClass + '">';
  html += '<div class="sc-top">';
  if (s.time) html += '<span class="sc-time">' + s.time + '</span>';
  html += '<span class="sc-customer">' + esc(s.customer_name || '') + '</span>';
  html += '<span class="type-badge type-' + s.visit_type + '">' + _vtLabel(s.visit_type) + '</span>';
  html += '<span class="status-badge status-' + s.status + '">' + _t('vs_status_' + s.status) + '</span>';
  html += '<span class="priority-dot ' + (s.priority || 'normal') + '"></span>';
  html += '</div>';
  if (s.customer_erp) html += '<div class="sc-info">ERP: ' + esc(s.customer_erp) + '</div>';
  if (s.address) html += '<div class="sc-info">' + esc(s.address) + '</div>';
  if (s.purpose) html += '<div class="sc-purpose">' + esc(s.purpose) + '</div>';
  if (s.notes) html += '<div class="sc-info" style="color:#64748b;font-style:italic">' + esc(s.notes) + '</div>';
  if (showAllEmployees && s.emp_name) html += '<div class="sc-emp">' + esc(s.emp_name) + ' (' + esc(s.empid) + ')</div>';
  if (s.status === 'planned') {
    html += '<div class="sc-actions">';
    html += '<button class="btn btn-sm btn-secondary" onclick="editSchedule(\'' + s._id + '\')">' + _t('vs_edit') + '</button>';
    html += '<button class="btn btn-sm btn-primary" onclick="completeSchedule(\'' + s._id + '\')">' + _t('vs_complete') + '</button>';
    html += '<button class="btn btn-sm btn-secondary" onclick="openPostpone(\'' + s._id + '\')">' + _t('vs_postpone') + '</button>';
    html += '<button class="btn btn-sm btn-danger" onclick="cancelSchedule(\'' + s._id + '\')">' + _t('vs_cancel') + '</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// List view
function renderListView() {
  var container = document.getElementById('listContent');
  var upcoming = allSchedules.filter(function(s) { return s.status === 'planned'; });
  upcoming.sort(function(a, b) {
    var c = a.date.localeCompare(b.date);
    if (c !== 0) return c;
    return (a.time || '99:99').localeCompare(b.time || '99:99');
  });
  if (upcoming.length === 0) {
    container.innerHTML = '<div class="no-data">' + _t('vs_no_schedule') + '</div>';
    return;
  }
  var html = '';
  var lastDate = '';
  upcoming.forEach(function(s) {
    if (s.date !== lastDate) {
      var d = new Date(s.date);
      var dayNames = _dayNames[_lang] || _dayNames['ko'];
      html += '<div class="list-group-date">' + s.date + ' (' + dayNames[d.getDay()] + ')</div>';
      lastDate = s.date;
    }
    html += buildCardHtml(s);
  });
  container.innerHTML = html;
}

// View switch
function switchView(v) {
  currentView = v;
  document.getElementById('calendarView').style.display = v === 'calendar' ? '' : 'none';
  document.getElementById('listView').style.display = v === 'list' ? '' : 'none';
  document.getElementById('btnCalView').classList.toggle('active', v === 'calendar');
  document.getElementById('btnListView').classList.toggle('active', v === 'list');
  if (v === 'list') renderListView();
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedDate = null;
  render();
}

function goToday() {
  var today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  selectedDate = formatDate(today);
  render();
}

function toggleAllEmployees() {
  showAllEmployees = document.getElementById('chkAllEmp').checked;

}

function closeFormModal() {

}

function editSchedule(docId) {
  var s = allSchedules.find(function(x) { return x._id === docId; });
  if (!s) return;
  document.getElementById('editDocId').value = docId;
  document.getElementById('formTitle').textContent = _t('vs_edit');
  document.getElementById('fDate').value = s.date || '';
  document.getElementById('fTime').value = s.time || '';
  document.getElementById('fErp').value = s.customer_erp || '';
  document.getElementById('fCustName').value = s.customer_name || '';
  document.getElementById('fAddress').value = s.address || '';
  if (s.customer_erp || s.customer_name) {
    document.getElementById('ccErp').textContent = s.customer_erp ? '[' + s.customer_erp + ']' : '';
    document.getElementById('ccName').textContent = s.customer_name || '';
    document.getElementById('ccSub').textContent = '';
    document.getElementById('custSearchWrap').style.display = 'none';
    document.getElementById('custCard').classList.add('show');
  } else {
    document.getElementById('fCustomer').value = '';
    document.getElementById('custSearchWrap').style.display = '';
    document.getElementById('custCard').classList.remove('show');
  }
  document.getElementById('fType').value = s.visit_type || 'regular';
  document.getElementById('fPriority').value = s.priority || 'normal';
  document.getElementById('fPurpose').value = s.purpose || '';
  document.getElementById('fNotes').value = s.notes || '';
  document.getElementById('formModal').classList.add('show');
}

function saveSchedule() {
  var docId = document.getElementById('editDocId').value;
  var data = {
    date: document.getElementById('fDate').value,
    time: document.getElementById('fTime').value,
    customer_erp: document.getElementById('fErp').value.trim(),
    customer_name: document.getElementById('fCustName').value.trim(),
    address: document.getElementById('fAddress').value.trim(),
    visit_type: document.getElementById('fType').value,
    priority: document.getElementById('fPriority').value,
    purpose: document.getElementById('fPurpose').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  };
  if (!data.date) { alert(_t('vs_date')); return; }
  if (!data.customer_name) { alert(_t('vs_customer')); return; }

  var promise;
  if (docId) {
    promise = db.collection('visit_schedules').doc(docId).update(data);
  } else {
    data.empid = currentUser.empid;
    data.emp_name = currentUser.name || currentUser.emp_name || '';
    data.status = 'planned';
    data.completed_visit_id = '';
    data.created_at = firebase.firestore.FieldValue.serverTimestamp();
    promise = db.collection('visit_schedules').add(data);
  }
  promise.then(function() {
    showToast(_t('vs_saved'));
    closeFormModal();
    loadData();
  }).catch(function(e) {
    alert('Error: ' + e.message);
  });
}

// Actions
function completeSchedule(docId) {
  if (!confirm(_t('vs_complete') + '?')) return;
  db.collection('visit_schedules').doc(docId).update({
    status: 'completed',
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    showToast(_t('vs_status_completed'));
    loadData();
  });
}

function cancelSchedule(docId) {
  if (!confirm(_t('vs_cancel') + '?')) return;
  db.collection('visit_schedules').doc(docId).update({
    status: 'cancelled',
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    showToast(_t('vs_status_cancelled'));
    loadData();
  });
}

function openPostpone(docId) {
  postponeDocId = docId;
  var s = allSchedules.find(function(x) { return x._id === docId; });
  document.getElementById('postponeDate').value = s ? s.date : '';
  document.getElementById('postponeBackdrop').classList.add('show');
  document.getElementById('postponeModal').classList.add('show');
}
function closePostpone() {
  postponeDocId = null;
  document.getElementById('postponeBackdrop').classList.remove('show');
  document.getElementById('postponeModal').classList.remove('show');
}
function confirmPostpone() {
  var newDate = document.getElementById('postponeDate').value;
  if (!newDate || !postponeDocId) return;
  var orig = allSchedules.find(function(x) { return x._id === postponeDocId; });
  if (!orig) return;
  // Mark original as postponed
  var batch = db.batch();
  var origRef = db.collection('visit_schedules').doc(postponeDocId);
  batch.update(origRef, { status: 'postponed', updated_at: firebase.firestore.FieldValue.serverTimestamp() });
  // Create new entry
  var newRef = db.collection('visit_schedules').doc();
  batch.set(newRef, {
    empid: orig.empid,
    emp_name: orig.emp_name || '',
    date: newDate,
    time: orig.time || '',
    customer_erp: orig.customer_erp || '',
    customer_name: orig.customer_name || '',
    address: orig.address || '',
    visit_type: orig.visit_type || 'regular',
    purpose: orig.purpose || '',
    priority: orig.priority || 'normal',
    status: 'planned',
    notes: orig.notes || '',
    completed_visit_id: '',
    created_at: firebase.firestore.FieldValue.serverTimestamp(),
    updated_at: firebase.firestore.FieldValue.serverTimestamp()
  });
  batch.commit().then(function() {
    showToast(_t('vs_status_postponed'));
    closePostpone();
    loadData();
  });
}

// Utility
function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function esc(s) {
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// Window controls
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
}
